function curIntensity(){ return S.intensity||'intense'; }
/* Le programme du jour : plus l'intensité monte, plus il y a de travail (mais toujours
   UN palier de leçon/jour). warm/lesson/ear = socle ; tech/song/mix = surcharge. */
function dailyProgram(){
  const nl=nextLesson(), nErr=errCount(), wk=weakSpot(), lvl=curIntensity();
  const P=[];
  P.push(nErr>=3
    ? {key:'warm', ic:'🩹', txt:'Rattrapage : '+nErr+' erreur'+(nErr>1?'s':'')+' en attente', fn:()=>dojoErrs()}
    : {key:'warm', ic:'⚡', txt:'Échauffement : sprint de 10 accords', fn:()=>dojoChords()});
  P.push({key:'lesson', ic:'📖', lesson:true,
    txt: nl?('Leçon : '+nl.title):'Révision : une leçon au hasard',
    fn:()=>openLesson(nl||ALL_LESSONS[Math.floor(Math.random()*ALL_LESSONS.length)])});
  /* RYTHME tous les jours (priorité : c'est ce qui manque le plus pour jouer vraiment) */
  P.push({key:'rhythm', ic:'🥁', txt:'Rythme : tape la mesure en place', fn:()=>rhythmRoom()});
  /* écoute : UNE SEULE par jour, alternée note/couleur (moins d'écoute, plus d'entraînement) */
  const earDay=Math.floor(Date.now()/864e5)%2;
  if(earDay===0) P.push({key:'notes', ic:'🎧', txt:'Oreille des notes : retrouve la note', fn:()=>noteEarRoom()});
  else P.push((wk && wk.key==='degres' && S.done['m2l1'])
    ? {key:'ear', ic:'🏛', txt:'Point faible : quiz des degrés', fn:()=>dojoDeg()}
    : {key:'ear', ic:'👂', txt:'Oreille des couleurs : majeur/mineur', fn:()=>dojoEar()});
  if(lvl==='normal') return P;
  /* intense : + technique (renversements/7e) + un exercice varié tournant */
  if(S.done['m5l1']) P.push({key:'tech', ic:'🎨', txt:'Technique : sprint des 7e', fn:()=>dojoSev()});
  else if(S.done['m1l1']) P.push({key:'tech', ic:'🔄', txt:'Technique : les renversements', fn:()=>dojoInv()});
  const pool=DAILY_DRILLS.filter(x=>!x.req||S.done[x.req]);
  if(pool.length){
    const pick=pool[Math.floor(Date.now()/864e5)%pool.length];
    P.push({key:'drill', ic:pick.ic, txt:pick.txt, fn:pick.fn});
  }
  if(lvl==='intense') return P;
  /* forge & marathon : + session mixte (révision de tout l\'acquis) */
  if(S.done['m0l2']) P.push({key:'mix', ic:'🎯', txt:'Session mixte : révise tout', fn:()=>dojoMix()});
  if(lvl==='forge') return P;
  /* marathon (temps doublé) : + technique gammes & arpèges */
  P.push({key:'scales', ic:'🎼', txt:'Technique : gammes & arpèges', fn:()=>dojoScale()});
  return P;
}

function earStat(id){ if(!S.earStats) S.earStats={}; return S.earStats[id]||{n:0,best:0}; }
/* historique des séances (pct) pour rendre la progression VISIBLE et mesurée */
function earPush(id,pct){
  if(!S.earStats) S.earStats={};
  const st=S.earStats[id]||{n:0,best:0};
  st.n=(st.n||0)+1; st.best=Math.max(st.best||0,pct); st.last=pct;
  st.hist=(st.hist||[]).concat([{d:todayStr(),p:pct}]).slice(-30);
  S.earStats[id]=st;
}
const EAR_MM=['duel','samediff','l1','l2','l3','l4']; /* niveaux majeur/mineur (hors 7e) */
function earAllHist(){
  let all=[]; EAR_MM.forEach(id=>{ const st=earStat(id); if(st.hist) all=all.concat(st.hist); });
  return all.sort((a,b)=> a.d<b.d?-1:a.d>b.d?1:0);
}
const _avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function earTrend(hist){
  const ps=hist.map(h=>h.p); if(ps.length<2) return null;
  const half=Math.max(1,Math.floor(ps.length/2));
  const older=_avg(ps.slice(0,half)), recent=_avg(ps.slice(-Math.min(5,ps.length)));
  return {recent, delta:recent-older, n:ps.length, best:Math.max.apply(null,ps)};
}
function earSpark(hist){
  const ps=hist.slice(-14).map(h=>h.p);
  return `<div class="spark">${ps.map(p=>`<i style="height:${Math.max(4,p)}%;background:${p>=80?'var(--ok)':p>=60?'var(--acc)':'var(--bad)'}"></i>`).join('')}</div>`;
}
/* le niveau à travailler = le premier pas encore tenu à 80 % */
function earNextLevel(){
  for(const L of EAR_LEVELS){ const st=earStat(L.id); if(st.best<80) return L.id; }
  return EAR_LEVELS[EAR_LEVELS.length-1].id;
}

function earRun(inner,L){
  const done=(ok,sc)=>{
    const pct=Math.round(sc/L.cfg.count*100);
    earPush(L.id,pct);
    if(sc>S.earBest){ S.earBest=sc; }
    save();
    dailyMark('ear'); award(10);
    toast(`+10 XP · ${sc}/${L.cfg.count}`);
    closeOverlay();
  };
  if(L.ab) runEarAB(inner,L.cfg,done);
  else runEar(inner,{...L.cfg,pass:0},done);
}

/* moteur : joue une note cible, l'utilisateur la retrouve sur le clavier */
function runNoteEar(el, cfg, cb){
  const pool=[]; for(let m=cfg.lo;m<=cfg.hi;m++){ if(cfg.whitesOnly&&isBlack(m)) continue; pool.push(m); }
  let i=0, correct=0, target=null, candidate=null, answered=false; const bad=new Set();
  el.innerHTML=`<div class="exhead"><div class="target">🎧</div><div class="sub" id="nesub">${cfg.name}</div></div>
    <div class="exprog" id="ndots"></div>`;
  const dots=el.querySelector('#ndots'), sub=el.querySelector('#nesub');
  const row=document.createElement('div'); row.className='exrow';
  row.innerHTML=`<button class="btn ghost" id="hear">🔊 Réécouter</button>${cfg.ref!=null?`<button class="btn ghost" id="ref">🎹 Repère : ${NOTE_FR[cfg.ref%12]}</button>`:''}`;
  el.appendChild(row);
  const kb=buildKeyboard(cfg.lo,cfg.hi,onTap); el.appendChild(kb);
  const fb=document.createElement('div'); fb.className='fb'; el.appendChild(fb);
  const valRow=document.createElement('div'); valRow.className='exrow';
  const val=document.createElement('button'); val.className='btn'; val.textContent='✓ Valider'; val.disabled=true;
  valRow.appendChild(val); el.appendChild(valRow);
  if(!cfg.explore){ val.style.display='none'; }
  row.querySelector('#hear').onclick=()=>{ if(target!=null) playNote(target,1.5,.42); };
  if(cfg.ref!=null) row.querySelector('#ref').onclick=()=>playNote(cfg.ref,1.4,.32);
  val.onclick=()=>{ if(candidate!=null) commit(); };

  function onTap(m,k){
    if(answered){ if(cfg.explore) playNote(m); return; }
    if(cfg.explore){
      playNote(m); candidate=m; kb.clearSel(); k.classList.add('sel'); val.disabled=false;
      fb.className='fb'; fb.textContent='Ta réponse : '+NOTE_FR[m%12];
    } else { candidate=m; commit(); }
  }
  function commit(){
    if(answered||candidate==null) return;
    answered=true; val.disabled=true;
    const ok=candidate===target;
    playNote(target,1.4,.42);
    if(ok){
      correct++; const ke=kb.keyEl(target); if(ke) ke.classList.add('flash');
      fb.className='fb ok'; fb.textContent='✓ Oui — '+NOTE_FR[target%12]; chime();
    } else {
      bad.add(i); buzz();
      const ck=kb.keyEl(candidate); if(ck) ck.classList.add('wrong');
      const tk=kb.keyEl(target); if(tk) tk.classList.add('hint');
      fb.className='fb bad'; fb.textContent='C\'était '+NOTE_FR[target%12]+(cfg.explore?' (toi : '+NOTE_FR[candidate%12]+')':'');
    }
    progDots(dots,cfg.count,i+1,bad); i++;
    setTimeout(()=>{ if(i>=cfg.count) cb(correct,Math.round(correct/cfg.count*100)); else next(); }, ok?800:1700);
  }
  function next(){
    candidate=null; answered=false; val.disabled=true; fb.textContent=''; fb.className='fb'; kb.clearSel();
    progDots(dots,cfg.count,i,bad);
    target=pool[Math.floor(Math.random()*pool.length)];
    sub.textContent=`Note ${i+1}/${cfg.count} — ${cfg.explore?'explore et valide':'appuie sur la note, du premier coup'}`;
    setTimeout(()=>playNote(target,1.5,.42),400);
  }
  next();
}

/* ================================================================
   L'ATELIER RYTHME — taper les rythmes EN PLACE, précision notée au ms
   (le chaînon qui sépare « connaître la théorie » de « jouer vraiment »)
   ================================================================ */
function woodblock(t,accent){
  const ctx=ac(), o=ctx.createOscillator(), g=ctx.createGain();
  o.type='triangle'; o.frequency.value=accent?1250:840;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(accent?.5:.34,t+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.08);
}
const _rr=()=>Math.random();
/* générateurs : renvoient les onsets (en temps, dans [0,4)) d'UNE mesure à 4 temps */
function rgQuarter(){ return [0,1,2,3]; }
function rgEighth(){ return [0,.5,1,1.5,2,2.5,3,3.5]; }
function rgMix(){ const o=[]; for(let b=0;b<4;b++){ if(_rr()<.5) o.push(b); else o.push(b,b+.5); } return o; }
function rgRest(){ const o=[0]; [.5,1,1.5,2,2.5,3,3.5].forEach(g=>{ if(_rr()<.55) o.push(g); }); return o.sort((a,b)=>a-b); }
function rgSync(){ const s=new Set([0]); for(let b=0;b<4;b++){ if(_rr()<.65) s.add(b+.5); if(b>0&&_rr()<.35) s.add(b); } return [...s].sort((a,b)=>a-b); }
function rgTriplet(){ const o=[]; for(let b=0;b<4;b++){ if(_rr()<.7) o.push(b,b+1/3,b+2/3); else o.push(b); } return o; }
function rgSixteenth(){ const figs=[[0],[0,.5],[0,.25,.5,.75],[0,.25,.5],[0,.5,.75],[0,.75]]; const o=[]; for(let b=0;b<4;b++){ figs[Math.floor(_rr()*figs.length)].forEach(x=>o.push(b+x)); } return o; }
function rgDictee(){ const p=[rgMix,rgRest,rgSync,rgSixteenth]; return p[Math.floor(_rr()*p.length)](); }
const RHYTHM_LEVELS=[
  {id:'rq', t:'① Les noires', d:'Un tap sur chaque temps. La pulsation — la fondation de tout.', bpm:80, gen:rgQuarter},
  {id:'re', t:'② Les croches', d:'Deux fois par temps : « 1 & 2 & ». Diviser le temps en deux.', bpm:76, gen:rgEighth},
  {id:'rm', t:'③ Noires & croches', d:'Des motifs qui mélangent les deux. Lis le rythme, ne le devine pas.', bpm:78, gen:rgMix},
  {id:'rr', t:'④ Avec silences', d:'Ne tape QUE les onsets marqués. Le silence fait partie du rythme.', bpm:80, gen:rgRest},
  {id:'rs', t:'⑤ Syncopes', d:'L\'accent sur le contretemps — le sel du groove.', bpm:74, gen:rgSync},
  {id:'rt', t:'⑥ Triolets', d:'Trois par temps : « 1-et-là ». La pulsation ternaire.', bpm:72, gen:rgTriplet},
  {id:'rx', t:'⑦ Doubles-croches', d:'Quatre par temps. Là, ça devient sérieux.', bpm:64, gen:rgSixteenth},
  {id:'rd', t:'⑧ Dictée rythmique', d:'Motif tiré au hasard à chaque mesure. Le vrai test de lecture.', bpm:76, gen:rgDictee},
];
function rhythmStat(id){ if(!S.rhythmStats) S.rhythmStats={}; return S.rhythmStats[id]||{n:0,best:0}; }
function rhythmNextLevel(){ for(const L of RHYTHM_LEVELS){ if(rhythmStat(L.id).best<80) return L.id; } return RHYTHM_LEVELS[RHYTHM_LEVELS.length-1].id; }
function rhythmPush(id,pct,bpm){
  if(!S.rhythmStats) S.rhythmStats={};
  const st=S.rhythmStats[id]||{n:0,best:0};
  st.n=(st.n||0)+1; st.best=Math.max(st.best||0,pct); st.last=pct;
  if(pct>=80) st.bpmBest=Math.max(st.bpmBest||0,bpm);
  st.hist=(st.hist||[]).concat([{d:todayStr(),p:pct}]).slice(-30);
  S.rhythmStats[id]=st;
}
/* étiquette de comptage d'un onset (1, 1&, 1e, 1a, ou triolet) */
function countLabel(b){
  const w=Math.floor(b+1e-6), f=b-w, base=(w%4)+1;
  if(f<.02) return ''+base;
  if(Math.abs(f-.5)<.03) return base+'&';
  if(Math.abs(f-.25)<.03) return base+'e';
  if(Math.abs(f-.75)<.03) return base+'a';
  if(Math.abs(f-1/3)<.04) return base+'·';
  if(Math.abs(f-2/3)<.04) return base+'··';
  return ''+base;
}
/* SCORING pur (testable) : compare les frappes aux onsets attendus (temps en secondes) */
function rhythmScore(expected, taps, spb){
  const win=Math.min(.19, spb*.5), used=new Array(taps.length).fill(false), per=[];
  let sumErr=0,sumAbs=0,perfect=0,good=0,loose=0,missed=0;
  expected.forEach(et=>{
    let bi=-1,bd=1e9;
    taps.forEach((tt,ti)=>{ if(used[ti])return; const d=tt-et; if(Math.abs(d)<Math.abs(bd)&&Math.abs(d)<=win){bd=d;bi=ti;} });
    if(bi>=0){ used[bi]=true; const a=Math.abs(bd); sumErr+=bd; sumAbs+=a;
      let q; if(a<.055){perfect++;q='perfect';} else if(a<.11){good++;q='good';} else {loose++;q='loose';}
      per.push(q);
    } else { missed++; per.push('miss'); }
  });
  const matched=perfect+good+loose, extra=used.filter(u=>!u).length;
  const points=perfect*100+good*72+loose*42, penalty=extra*45;
  const pct=Math.max(0,Math.min(100,Math.round((points-penalty)/(expected.length*100)*100)));
  return {pct, matched, perfect, good, loose, missed, extra, per,
    avgMs: matched?Math.round(sumAbs/matched*1000):null,
    rushMs: matched?Math.round(sumErr/matched*1000):0};
}
/* moteur : compte, joue la pulsation, l'utilisateur tape, on note la précision */
function runRhythm(el, cfg, cb){
  const bars=cfg.bars||2;
  let bpm=cfg.bpm, pattern=cfg.gen();
  let taps=[], recording=false, running=false, t0=0, endT=0, raf=null, done=false;
  el.innerHTML=`<div class="exhead"><div class="target">🥁</div><div class="sub" id="rsub">${cfg.name||cfg.t||''}</div></div>
    <div class="rpills" id="rpills"></div>
    <div class="rbeats" id="rbeats"><i class="a1"></i><i></i><i></i><i></i></div>
    <div class="tempo"><span class="tl">Tempo</span><input type="range" min="50" max="120" step="2" value="${bpm}"><span class="tv">${bpm} BPM</span></div>
    <div class="rpad" id="rpad">TAPE ICI<small>en rythme avec le clic</small></div>
    <div class="fb" id="rfb"></div>
    <div class="exrow"><button class="btn ghost" id="rhear">🔊 Écouter le rythme</button><button class="btn" id="rgo">🎯 À toi</button></div>`;
  const pills=el.querySelector('#rpills'), beats=[...el.querySelectorAll('#rbeats i')], pad=el.querySelector('#rpad'),
        fb=el.querySelector('#rfb'), sub=el.querySelector('#rsub'), tv=el.querySelector('.tv'), slider=el.querySelector('input');
  function drawPills(){
    pills.innerHTML=pattern.map(b=>`<span class="rpill" data-b="${b}">${countLabel(b)}</span>`).join('');
  }
  drawPills();
  slider.oninput=()=>{ if(running) return; bpm=+slider.value; tv.textContent=bpm+' BPM'; };
  el.querySelector('#rhear').onclick=()=>{ if(!running) demo(); };
  el.querySelector('#rgo').onclick=()=>{ if(!running) start(); };
  pad.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!recording) return;
    taps.push(ac().currentTime); pad.classList.add('hit'); setTimeout(()=>pad.classList.remove('hit'),90); });

  function spb(){ return 60/bpm; }
  function demo(){
    running=true; const S0=spb(), t=ac().currentTime+.15;
    for(let k=0;k<4;k++) woodblock(t+k*S0, k===0);        // décompte
    pattern.forEach(b=> woodblock(t+(4+b)*S0, false));     // la mesure jouée
    for(let k=0;k<4;k++) Metro.click(t+(4+k)*S0, k===0);
    setTimeout(()=>{ running=false; }, (8*S0+.3)*1000);
  }
  function start(){
    running=true; recording=false; taps=[]; done=false; drawPills(); fb.textContent=''; fb.className='fb';
    pad.classList.add('rec'); pad.firstChild.textContent='…';
    const S0=spb(), base=ac().currentTime+.15;
    for(let k=0;k<4;k++) woodblock(base+k*S0, k===0);      // décompte 1 mesure
    t0=base+4*S0;                                          // début de l'enregistrement
    for(let k=0;k<bars*4;k++) Metro.click(t0+k*S0, k%4===0);
    endT=t0+bars*4*S0;
    setTimeout(()=>{ recording=true; pad.firstChild.textContent='TAPE !'; }, (base+4*S0-ac().currentTime)*1000);
    frame();
  }
  function frame(){
    if(!running) return;
    const now=ac().currentTime, S0=spb();
    if(now>=t0){
      const bt=Math.floor((now-t0)/S0)%4;
      beats.forEach((d,i)=>d.classList.toggle('on', i===bt && now<endT));
      const posInBar=((now-t0)/S0)%4;
      el.querySelectorAll('.rpill').forEach(p=>{ const b=+p.dataset.b; p.classList.toggle('play', Math.abs(b-posInBar)<.14); });
    }
    if(now>=endT+.25){ beats.forEach(d=>d.classList.remove('on')); return finish(); }
    raf=requestAnimationFrame(frame);
  }
  function finish(){
    if(done) return; done=true; running=false; recording=false;
    pad.classList.remove('rec'); pad.firstChild.textContent='TAPE ICI';
    const S0=spb(), expected=[]; for(let bar=0;bar<bars;bar++) pattern.forEach(b=> expected.push(t0+(bar*4+b)*S0));
    const r=rhythmScore(expected, taps, S0);
    /* coloration des pills (sur la 1re mesure, à titre indicatif) */
    const first=r.per.slice(0,pattern.length);
    el.querySelectorAll('.rpill').forEach((p,i)=>{ if(first[i]) p.classList.add(first[i]); });
    const timing = r.avgMs==null ? '' :
      (Math.abs(r.rushMs)<18 ? ' · pile en place' : r.rushMs<0 ? ` · tu presses (~${-r.rushMs} ms en avance)` : ` · tu traînes (~${r.rushMs} ms en retard)`);
    sub.textContent=`${r.pct}%${timing}`;
    fb.className='fb '+(r.pct>=80?'ok':'bad');
    fb.innerHTML=`${r.perfect} pile · ${r.good} bon · ${r.loose} approx · ${r.missed} manqué${r.extra?` · ${r.extra} en trop`:''}`;
    cb(r.pct, bpm);
  }
}
function rhythmRoom(){
  openCustom('🥁 L\'atelier rythme',(inner)=>{
    const menu=document.createElement('div');
    menu.innerHTML=`<p style="color:var(--dim);font-size:14px;margin-bottom:8px">Le rythme, c'est la moitié de la musique — et ça se muscle comme le reste. Tape le motif <b style="color:var(--txt)">en place</b> avec le clic ; l'app note ta précision au millième et te dit si tu presses ou si tu traînes.</p>`;
    inner.appendChild(menu);
    const allH=[]; RHYTHM_LEVELS.forEach(L=>{ const st=rhythmStat(L.id); if(st.hist) allH.push.apply(allH,st.hist); });
    allH.sort((a,b)=> a.d<b.d?-1:a.d>b.d?1:0);

      const dir=tr.delta>=6?'up':tr.delta<=-6?'down':'flat';
      const verdict=dir==='up'?`▲ +${tr.delta} points depuis tes débuts. Ta horloge interne se cale — c'est mesuré.`

        :`→ Stable. Baisse le tempo, cherche le « pile en place », puis remonte progressivement.`;
      const pc=document.createElement('div'); pc.className='card'; pc.style.borderColor='var(--acc)';
      pc.innerHTML=`<b style="font-size:15px">📈 Ta progression — rythme</b>

        <div class="m"><b>${tr.best}%</b><small>record</small></div><div class="m"><b>${tr.n}</b><small>séances</small></div></div>
        ${earSpark(allH)}<div class="trendline ${dir}">${verdict}</div>`;

    }
    const reco=rhythmNextLevel();
    RHYTHM_LEVELS.forEach(L=>{
      const st=rhythmStat(L.id), isReco=L.id===reco, lt=st.hist?earTrend(st.hist):null;
      const c=document.createElement('div'); c.className='card'; if(isReco) c.style.borderColor='var(--acc)';

        ${isReco?'<div style="font-size:11px;font-weight:800;color:var(--acc);letter-spacing:1px;margin-top:2px">▶ COMMENCE ICI</div>':''}
        <p style="color:var(--dim);font-size:13px;margin:4px 0 0;line-height:1.5">${L.d}</p>
        ${st.hist&&st.hist.length>=2?earSpark(st.hist):''}`;
      const b=document.createElement('button'); b.className=isReco?'btn':'btn ghost'; b.textContent='Lancer';
      b.onclick=()=>{ menu.remove(); const box=document.createElement('div'); inner.appendChild(box);
        runRhythm(box,{name:L.t,bpm:L.bpm,gen:L.gen,bars:2},(pct,bpm)=>{
          rhythmPush(L.id,pct,bpm); save(); dailyMark('rhythm'); award(12); chime();

/* ---------- générateurs des nouvelles salles ---------- */
function genInvItems(n,types){
  const items=[];
  while(items.length<n){
    const root=Math.floor(Math.random()*12);
    const t=types[Math.floor(Math.random()*types.length)];
    const iv=CHORD_TYPES[t].iv;
    const bass=(root+iv[1+Math.floor(Math.random()*(iv.length-1))])%12;
    items.push({root,t,bass});
  }
  return items;
}
const MAJ_SCALE=[0,2,4,5,7,9,11];
const DEGS=[['I',0,'maj'],['ii',1,'min'],['iii',2,'min'],['IV',3,'maj'],['V',4,'maj'],['vi',5,'min']];
const DEG_KEYS=[0,7,5,2,9,4,10];
function genDegQs(n){
  const qs=[];
  while(qs.length<n){
    const key=DEG_KEYS[Math.floor(Math.random()*DEG_KEYS.length)];
    const scaleStr=MAJ_SCALE.map(s=>NOTE[(key+s)%12]).join(' ');
    if(Math.random()<.65){
      const [dn,dd,dt]=DEGS[1+Math.floor(Math.random()*5)];
      const good=chordName((key+MAJ_SCALE[dd])%12,dt);
      const opts=new Set([good]);
      while(opts.size<3){
        const o=DEGS[1+Math.floor(Math.random()*5)];
        opts.add(chordName((key+MAJ_SCALE[o[1]])%12,o[2]));
      }
      const arr=[...opts].sort(()=>Math.random()-.5);
      qs.push({q:`En ${NOTE[key]} majeur, le degré ${dn} est…`, opts:arr, a:arr.indexOf(good),
        why:`Gamme de ${NOTE[key]} : ${scaleStr}. Le ${dn} est ${good}${dt==='min'?' (minuscule = mineur)':''}.`});
    } else {
      const prog=Math.random()<.5
        ? {n:'I–V–vi–IV',d:[[0,'maj'],[4,'maj'],[5,'min'],[3,'maj']]}
        : {n:'vi–IV–I–V',d:[[5,'min'],[3,'maj'],[0,'maj'],[4,'maj']]};
      const str=k2=>prog.d.map(([di,t])=>chordName((k2+MAJ_SCALE[di])%12,t)).join('–');
      const good=str(key);
      const opts=new Set([good]);
      while(opts.size<3) opts.add(str(DEG_KEYS[Math.floor(Math.random()*DEG_KEYS.length)]));
      const arr=[...opts].sort(()=>Math.random()-.5);
      qs.push({q:`${prog.n} en ${NOTE[key]} majeur donne…`, opts:arr, a:arr.indexOf(good),
        why:`Gamme de ${NOTE[key]} : ${scaleStr}. On compte les degrés dessus → ${good}.`});
    }
  }
  return qs;
}
const VL_KEYS=[0,2,5,7,9];
function vlCycle(key){
  return Math.random()<.5
    ? [{root:key,t:'maj'},{root:(key+5)%12,t:'maj',bass:key},{root:(key+7)%12,t:'maj',bass:(key+11)%12},{root:key,t:'maj'}]
    : [{root:key,t:'maj'},{root:(key+9)%12,t:'min',bass:key},{root:(key+5)%12,t:'maj',bass:key},{root:(key+7)%12,t:'maj',bass:(key+11)%12},{root:key,t:'maj'}];
}
function genScaleEx(){
  if(S.done['m8l4'] && Math.random()<.35) return genModeScale();
  if(S.done['m8l1'] && Math.random()<.35) return genMajScaleHard();

}

function dojoErrs(){
  const chordErrs=errsOf('chord').slice(0,8);
  const earErrs=errsOf('ear').slice(0,4);
  const quizErrs=errsOf('quiz').slice(0,4);
  if(!chordErrs.length && !earErrs.length && !quizErrs.length){
    return openCustom('🩹 Mes erreurs',(inner,close)=>{
      inner.insertAdjacentHTML('beforeend',`<div class="exhead"><div class="target">✨</div>
        <div class="sub">Rien en attente. Tout ce que tu as raté a été rattrapé — continue le parcours, l'app remplira cette salle toute seule.</div></div>`);
      const b=document.createElement('button'); b.className='btn'; b.textContent='Retour'; b.onclick=close; inner.appendChild(b);
    });
  }
  const segs=[];
  if(chordErrs.length) segs.push(['Accords ratés','chord',
    {items:chordErrs.map(([,e])=>e.d), noLog:true, sub:'Ceux que tu as manqués. Prends ton temps.'},
    (keys=>(ok,score,nFailed,failedSet)=>{
      keys.forEach((k,idx)=>{ if(failedSet && failedSet.has(idx)) errFail(k); else errPass(k); });
    })(chordErrs.map(([k])=>k))]);
  if(earErrs.length) segs.push(['Oreille','ear',
    {kinds:[...new Set(earErrs.map(([,e])=>e.d.t))], count:Math.max(3,earErrs.length), pass:0, noLog:true,
     sub:'Les couleurs que tu confonds. Sans faute = maîtrisées.'},
    (keys=>(ok,score,_n,_f,total)=>{
      const perfect=score>=Math.max(3,keys.length);
      keys.forEach(k=>perfect?errPass(k):errFail(k));
    })(earErrs.map(([k])=>k))]);
  if(quizErrs.length) segs.push(['Degrés','quiz',
    {qs:quizErrs.map(([,e])=>e.d), scored:true, noLog:true},
    (keys=>(ok,score)=>{ const perfect=score>=keys.length;
      keys.forEach(k=>perfect?errPass(k):errFail(k)); })(quizErrs.map(([k])=>k))]);

  const before=errCount();
  openCustom('🩹 Mes erreurs',(inner,close)=>{
    const runners={chord:runChord,ear:runEar,quiz:runQuiz};
    let k=0;
    const step=()=>{
      inner.querySelectorAll('.errseg').forEach(x=>x.remove());
      if(k>=segs.length){
        const fixed=Math.max(0,before-errCount());
        const d=document.createElement('div'); d.className='errseg';
        d.innerHTML=`<div class="exhead"><div class="target">🩹</div>
          <div class="sub">${fixed?`<b style="color:var(--ok)">${fixed}</b> erreur(s) définitivement rayée(s) de la liste.`:'Rien de rayé cette fois — il reste du travail, et c\'est exactement pour ça que la salle existe.'}
          ${errCount()?`<br>Encore <b>${errCount()}</b> en attente.`:'<br>Liste vide. Propre.'}</div></div>`;
        inner.appendChild(d);
        dailyMark('warm'); award(15); toast('🩹 Révision des erreurs · +15 XP');
        setTimeout(close,1900); return;
      }
      const [name,type,ex,onDone]=segs[k];
      const d=document.createElement('div'); d.className='errseg';
      d.innerHTML=`<p style="text-align:center;color:var(--acc);font-size:13px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px">${k+1}/${segs.length} — ${name}</p>`;

      inner.appendChild(d);
      runners[type](exDiv,ex,(...args)=>{ try{ onDone(...args); }catch(e){} k++; step(); });
    };
    step();
  });

  '0,3,6,9':  {suf:'°7',     fr:'diminué 7',            pri:3},
  '0,4,7,9':  {suf:'6',      fr:'sixte',                pri:3},
  '0,3,7,9':  {suf:'m6',     fr:'mineur 6',             pri:3},
  '0,2,4,7':  {suf:'add9',   fr:'add9',                 pri:4},
  '0,5,7,10': {suf:'7sus4',  fr:'7sus4',                pri:4},
  '0,2,4,7,10':{suf:'9',     fr:'neuvième',             pri:4},

  '0,2,3,7,10':{suf:'m9',    fr:'mineur 9',             pri:4},
};
const IV_NAME = {1:'seconde mineure',2:'seconde majeure',3:'tierce mineure',4:'tierce majeure',
  5:'quarte',6:'triton',7:'quinte',8:'sixte mineure',9:'sixte majeure',10:'septième mineure',11:'septième majeure'};

/* identifie un accord depuis des notes MIDI absolues. Détection exacte :
   les seules ambiguïtés sont musicales (Do6 vs Lam7), pas techniques. */
function identifyChord(midiNotes){
  const notes=[...new Set(midiNotes)].sort((a,b)=>a-b);
  if(!notes.length) return null;
  const bass=notes[0]%12;
  const pcs=[...new Set(notes.map(n=>n%12))].sort((a,b)=>a-b);
  if(pcs.length===1) return {sym:NOTE[pcs[0]], fr:NOTE_FR[pcs[0]]+' (note seule)', pcs, bass, kind:'note'};
  if(pcs.length===2){
    const iv=(pcs[1]-pcs[0]+12)%12;
    if(iv===7||iv===5){ const root=iv===7?pcs[0]:pcs[1];
      return {sym:NOTE[root]+'5', fr:NOTE_FR[root]+' quinte (power chord)', pcs, bass, kind:'dyad'}; }
    return {sym:NOTE[bass]+' + '+IV_NAME[iv], fr:'intervalle : '+IV_NAME[iv], pcs, bass, kind:'dyad'};
  }
  const cands=[];
  for(const root of pcs){
    const key=pcs.map(p=>(p-root+12)%12).sort((a,b)=>a-b).join(',');
    const tpl=MIDI_TPL[key];
    if(tpl) cands.push({root,tpl,bassIsRoot:root===bass});
  }
  if(!cands.length) return {sym:'—', fr:'accord non standard ('+pcs.map(p=>NOTE[p]).join(' ')+')', pcs, bass, kind:'unknown'};
  cands.sort((a,b)=> (b.bassIsRoot-a.bassIsRoot) || (a.tpl.pri-b.tpl.pri) || (a.root-b.root));
  const c=cands[0], slash=(c.root!==bass);
  return {
    sym:NOTE[c.root]+c.tpl.suf+(slash?'/'+NOTE[bass]:''),
    fr:NOTE_FR[c.root]+' '+c.tpl.fr+(slash?' (renversement, basse '+NOTE_FR[bass]+')':''),
    root:c.root, bass, pcs, kind:'chord',
    alt: cands.length>1 ? NOTE[cands[1].root]+cands[1].tpl.suf : null
  };
}

/* ---- plomberie Web MIDI ---- */
const MIDIN={access:null, held:new Set(), inputs:[], onUpdate:null, onDevices:null};
async function midiConnect(){
  if(!navigator.requestMIDIAccess) return {ok:false, reason:'no-api'};
  try{
    const access=await navigator.requestMIDIAccess({sysex:false});
    MIDIN.access=access;
    const bind=()=>{ MIDIN.inputs=[...access.inputs.values()];
      MIDIN.inputs.forEach(inp=>inp.onmidimessage=onMidiMsg);
      if(MIDIN.onDevices) MIDIN.onDevices(MIDIN.inputs); };
    access.onstatechange=bind; bind();
    return {ok:true};
  }catch(e){ return {ok:false, reason:'denied'}; }
}
function onMidiMsg(e){
  const [st,note,vel]=e.data, cmd=st&0xf0;
  if(cmd===0x90 && vel>0) MIDIN.held.add(note);
  else if(cmd===0x80 || (cmd===0x90 && vel===0)) MIDIN.held.delete(note);
  else return;
  if(MIDIN.onUpdate) MIDIN.onUpdate([...MIDIN.held].sort((a,b)=>a-b));
}
/* hook de test : simule un message MIDI sans matériel */
function midiSimulate(bytes){ onMidiMsg({data:bytes}); }

    const kb=buildKeyboard(36,84,()=>{}); inner.querySelector('#midiKb').appendChild(kb);
    const statusEl=inner.querySelector('#midiStatus'), chordEl=inner.querySelector('#midiChord'),
          frEl=inner.querySelector('#midiFr'), altEl=inner.querySelector('#midiAlt');
    const setStatus=(html)=>statusEl.innerHTML=html;

    MIDIN.onDevices=(inputs)=>{
      if(inputs.length) setStatus(`<b style="font-size:15px;color:var(--ok)">🎹 Connecté : ${inputs.map(i=>i.name).join(', ')}</b>
        <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Joue — l'app identifie en direct.</p>`);

    midiConnect().then(res=>{
      if(!res.ok && res.reason==='no-api')

          <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Autorise l'accès MIDI puis recharge la page.</p>`);
      else if(!MIDIN.inputs.length) MIDIN.onDevices([]);
    });
  });
}

/* ---------- moteur : ACCORDS ---------- */
function genChordItems(gen){
  const items=[]; const used=new Set();
  while(items.length<gen.count){
    const root=gen.roots[Math.floor(Math.random()*gen.roots.length)];
    const t=gen.types[Math.floor(Math.random()*gen.types.length)];
    const k=root+t; if(used.has(k)) continue; used.add(k);
    items.push({root,t});
  }
  return items;
}
function runChord(el,ex,cb){
  const items = ex.items || genChordItems(ex.gen);
  const pass = ex.pass || items.length;
  let i=0, fails=0, score=0, advancing=false; const badIdx=new Set(), failedItems=new Set();
  const sel=new Set();
  el.innerHTML=`<div class="exhead"><div class="target" id="tgt"></div><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="listen" style="margin-top:8px">🔊 Écouter la cible</button></div>
    <div class="exprog" id="dots"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>`;
  el.querySelector('#listen').onclick=()=>{
    const it=items[i]; if(it) playChord(it.hint||voicingFor(it.root,it.t,it.bass),1.6);
  };
  const kb=buildKeyboard(48,72,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const tgt=el.querySelector('#tgt'), fb=el.querySelector('#fb'), dots=el.querySelector('#dots');
  const show=()=>{
    const it=items[i]; sel.clear(); kb.clearSel(); advancing=false;
    tgt.textContent=it.label||chordName(it.root,it.t,it.bass);
    fb.textContent=''; fb.className='fb'; fails=0;
    progDots(dots,items.length,i,badIdx);
  };
  const check=()=>{
    if(advancing) return; /* anti double-validation pendant la fenêtre de succès */
    const it=items[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=(it.iv||CHORD_TYPES[it.t].iv).map(x=>(it.root+x)%12);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    let ok = pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok && it.bass!=null) ok = (Math.min(...sel)%12)===it.bass;
    if(ok){
      advancing=true; score++; playChord([...sel]); tada();
      fb.textContent='✓ '+(it.label||chordName(it.root,it.t))+' — '+(it.notesTxt||chordNotes(it.root,it.t)); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<items.length) show(); else finish(); },900);
    } else {
      fails++; failedItems.add(i);
      if(fails===1 && !ex.noLog) errAdd('chord', it);
      buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      if(fails===1) fb.textContent= it.msg1 || (it.bass!=null
        ? '✗ Vérifie les notes ET la basse (note la plus grave = '+NOTE[it.bass]+').'
        : '✗ Recompte : '+(CHORD_TYPES[it.t].iv.length>3?'4 notes.':'majeur = 4+3, mineur = 3+4.'));
      else if(fails===2) fb.textContent='✗ Les notes : '+(it.notesTxt||chordNotes(it.root,it.t));
      else {
        fb.textContent='Regarde les touches bleues, joue-les, et retiens le geste.';
        (it.hint||voicingFor(it.root,it.t,it.bass)).forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
      }
      fb.className='fb bad';
      if(fails>=3) badIdx.add(i);
    }
  };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=check;
  const finish=()=>{
    const okPass=score>=pass;
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'🥋':'👹'} ${score}/${items.length}</div>
      <div class="sub">${okPass ? (score===items.length?'Sans faute. Le dojo est fier.':'Validé. Les accords ratés : refais-les au vrai piano.')
      : 'En dessous de '+pass+'/'+items.length+'. On ne négocie pas avec les fondations : recommence.'}</div></div>`;
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runChord(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score,failedItems.size,failedItems,items),1300);
  };
  show();
}

/* ---------- moteur : PROGRESSION ---------- */
function runProg(el,ex,cb){
  const seq=[]; for(let r=0;r<ex.rounds;r++) seq.push(...ex.chords);
  let i=0, fails=0; const sel=new Set();
  el.innerHTML=`<div class="exhead"><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="demo" style="margin-top:8px">🔊 Écouter la progression</button></div>
    <div class="chips" id="chips"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>`;
  el.querySelector('#demo').onclick=()=>{
    ex.chords.forEach((c,ci)=>setTimeout(()=>playChord(voicingFor(c.root,c.t,ex.free?null:c.bass),1.1),ci*950));
  };
  const kb=buildKeyboard(48,72,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const chips=el.querySelector('#chips'), fb=el.querySelector('#fb');
  const draw=()=>{
    chips.innerHTML='';
    seq.forEach((c,ci)=>{
      const s=document.createElement('div');
      s.className='chip'+(ci===i?' cur':ci<i?' done':'');
      s.textContent=chordName(c.root,c.t, ex.free?null:c.bass);
      chips.appendChild(s);
    });
  };
  const show=()=>{ sel.clear(); kb.clearSel(); fb.textContent=''; fb.className='fb'; fails=0; draw(); };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=()=>{
    const c=seq[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=CHORD_TYPES[c.t].iv.map(x=>(c.root+x)%12);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    let ok = pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok && !ex.free && c.bass!=null) ok=(Math.min(...sel)%12)===c.bass;
    if(ok){
      playChord([...sel]); tada();
      fb.textContent='✓ '+chordName(c.root,c.t); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<seq.length) show(); else {
        el.innerHTML=`<div class="exhead"><div class="target">🌊</div>
          <div class="sub">Progression bouclée. Maintenant, la vraie version : au piano, en boucle, sans regarder.</div></div>`;
        setTimeout(()=>cb(true),1300);
      }},800);
    } else {
      fails++; buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      fb.textContent= fails>=2 ? '✗ '+chordName(c.root,c.t)+' = '+chordNotes(c.root,c.t)+(!ex.free&&c.bass!=null?' · basse : '+NOTE[c.bass]:'')
        : '✗ Pas ça. Construis-le calmement.';
      fb.className='fb bad';
    }
  };
  show();
}

/* ---------- moteur : GAMME ---------- */
function runScale(el,ex,cb){
  const pcSeq=ex.pattern.map(p=>(ex.root+p)%12);
  let idx=0, startMidi=null, resets=0;
  el.innerHTML=`<div class="exhead"><div class="target">${ex.name}</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div><div id="kb"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb');
  const kb=buildKeyboard(48,76,(m,k)=>{
    playNote(m,.8);
    if(idx===0 && m%12===pcSeq[0] && m+ex.pattern[ex.pattern.length-1]>76){
      fb.textContent='Bonne note, mais trop haut — le sommet sortirait du clavier. Commence plus grave.';
      fb.className='fb bad'; return;
    }
    const expected = idx===0 ? null : startMidi+ex.pattern[idx];
    const okTap = idx===0 ? (m%12===pcSeq[0]) : (m===expected);
    if(okTap){
      if(idx===0) startMidi=m;
      k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'),250);
      idx++;
      progDots(dots,ex.pattern.length,idx);
      if(idx>=ex.pattern.length){
        tada();
        fb.textContent='✓ Gamme complète.'; fb.className='fb ok';
        el.querySelectorAll('.key').forEach(x=>x.style.pointerEvents='none');
        setTimeout(()=>{
          el.innerHTML=`<div class="exhead"><div class="target">🪜</div>
          <div class="sub">Bien. Maintenant au vrai piano : la même, mains séparées, avec le bon doigté. Lentement.</div></div>`;
          setTimeout(()=>cb(true),1300);
        },800);
      } else {
        fb.textContent='Note '+(idx+1)+'/'+ex.pattern.length+' — la suivante est à '+(ex.pattern[idx]-ex.pattern[idx-1])+' demi-ton(s).';
        fb.className='fb';
      }
    } else {
      buzz(); resets++;
      idx=0; startMidi=null;
      progDots(dots,ex.pattern.length,0);
      fb.textContent= resets>=3
        ? '✗ On repart du début. Formule : '+ex.pattern.slice(1).map((p,j)=>p-ex.pattern[j]).join('-')
        : '✗ Mauvaise note — on repart de la première.';
      fb.className='fb bad';
    }
  });
  el.querySelector('#kb').appendChild(kb);
  progDots(dots,ex.pattern.length,0);
  fb.textContent='Commence sur '+NOTE[pcSeq[0]]+' ('+NOTE_FR[pcSeq[0]]+').';
}

/* ---------- moteur : OREILLE ---------- */
function runEar(el,ex,cb){
  let i=0, score=0, answered=false, cur=null, prevT=null, streakT=0; const badIdx=new Set();
  const label={maj:'Majeur',min:'Mineur',maj7:'maj7',m7:'m7',dom7:'7'};
  const third={maj:'tierce majeure — brillante (4 demi-tons)', min:'tierce mineure — sombre (3 demi-tons)'};
  el.innerHTML=`<div class="exhead"><div class="target">👂</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div>
    <div class="exrow"><button class="btn ghost" id="replay">🔊 Réécouter</button><button class="btn ghost" id="arp">🎵 Note par note</button></div>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  ex.kinds.forEach(k=>{
    const b=document.createElement('button'); b.className='btn ghost'; b.textContent=label[k]; b.dataset.k=k;
    b.onclick=()=>answer(k,b); btns.appendChild(b);
  });
  if(ex.kinds.length===3) btns.style.gridTemplateColumns='1fr 1fr 1fr';
  const notesOf=()=>{ const iv=CHORD_TYPES[cur.t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.rootMidi+x); };
  const playBlock=()=>{ if(cur) playChord(notesOf(),1.8, ex.dyad?0:.03); };
  const playArp=()=>{ if(cur) notesOf().forEach((m,idx)=>playNote(m,.7,.4,idx*.52)); };
  el.querySelector('#replay').onclick=playBlock;
  el.querySelector('#arp').onclick=playArp;
  const play=()=> ex.arp?playArp():playBlock();
  const next=()=>{
    answered=false;
    const root = ex.fixedRoot!=null ? ex.fixedRoot : 52+Math.floor(Math.random()*13);
    let t=ex.kinds[Math.floor(Math.random()*ex.kinds.length)];
    if(t===prevT && streakT>=2 && ex.kinds.length>1){ const o=ex.kinds.filter(k=>k!==prevT); t=o[Math.floor(Math.random()*o.length)]; }
    streakT = t===prevT ? streakT+1 : 1; prevT=t;
    cur={ t, rootMidi:root };
    fb.textContent=''; fb.className='fb';
    btns.querySelectorAll('.btn').forEach(b=>{ b.classList.remove('ok'); b.style.opacity=1; b.style.pointerEvents='auto'; });
    progDots(dots,ex.count,i,badIdx);
    setTimeout(play,400);
  };
  const answer=(k,b)=>{
    if(answered) return; answered=true;
    btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
    const isTri = cur.t==='maj'||cur.t==='min';
    if(k===cur.t){ score++; b.classList.add('ok'); tada();
      fb.textContent='✓ '+label[cur.t]+(isTri?' · '+third[cur.t]:''); fb.className='fb ok'; }
    else { buzz(); badIdx.add(i);
      if(!ex.noLog) errAdd('ear',{t:cur.t});
      /* LE moment où on apprend : on rejoue CE QUE TU AS CRU, puis CE QUE C'ÉTAIT,
         sur la même fondamentale. Entendre le contraste vaut dix bonnes réponses. */
      fb.innerHTML=`✗ Tu as dit <b>${label[k]}</b>, c'était <b>${label[cur.t]}</b>. Écoute les deux à la suite :`;
      fb.className='fb bad';
      btns.querySelector(`[data-k="${cur.t}"]`).classList.add('ok');
      const notesFor=t=>{ const iv=CHORD_TYPES[t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.rootMidi+x); };
      notesFor(k).forEach((m,ix)=>playNote(m,1.2,.34,.35+ix*.03));
      notesFor(cur.t).forEach((m,ix)=>playNote(m,1.6,.42,2.05+ix*.03));
    }
    setTimeout(()=>{ i++; if(i<ex.count) next(); else finish(); }, k===cur.t?1200:4200);
  };
  const finish=()=>{
    const okPass=score>=(ex.pass||0);
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'👂':'😵'} ${score}/${ex.count}</div>
      <div class="sub">${okPass ? 'Ton oreille s\'ouvre. Reviens demain : elle progresse en dormant.'
        : 'En dessous de '+ex.pass+'/'+ex.count+'. Normal au début — réécoute chaque couleur, puis recommence.'}</div></div>`;
    if(score>S.earBest){ S.earBest=score; save(); }
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runEar(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score),1300);
  };
  next();
}

/* ---------- moteur : OREILLE A/B (comparaison) ----------
   Le barreau qui manquait. Identifier un accord seul (« c'est majeur ? »)
   exige un modèle interne. COMPARER deux accords n'en exige aucun : c'est
   ainsi qu'on FABRIQUE le modèle. On ne passe à l'absolu qu'après. */
function runEarAB(el,ex,cb){
  let i=0, score=0, answered=false, cur=null, prevSol=null, streakSol=0; const badIdx=new Set();
  const label={maj:'Majeur',min:'Mineur'};
  el.innerHTML=`<div class="exhead"><div class="target">${ex.mode==='duel'?'🅰️🅱️':'↔️'}</div>
    <div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div>
    <div class="exrow"><button class="btn ghost" id="rep">🔊 Les deux</button>
      <button class="btn ghost" id="r1">① seul</button><button class="btn ghost" id="r2">② seul</button></div>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  const notesOf=t=>{ const iv=CHORD_TYPES[t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.root+x); };
  const playOne=(t,when)=>{ const n=notesOf(t);
    if(ex.arp) n.forEach((m,ix)=>playNote(m,.8,.4,when+ix*.4));
    else n.forEach((m,ix)=>playNote(m,1.5,.36,when+ix*.03)); };
  const gap=ex.arp?1.9:1.7;
  const playPair=()=>{ playOne(cur.a,.05); playOne(cur.b,gap); };
  el.querySelector('#rep').onclick=()=>cur&&playPair();
  el.querySelector('#r1').onclick=()=>cur&&playOne(cur.a,.05);
  el.querySelector('#r2').onclick=()=>cur&&playOne(cur.b,.05);
  const opts = ex.mode==='duel' ? [['1','① Le premier'],['2','② Le deuxième']]
                                : [['same','Pareils'],['diff','Différents']];
  opts.forEach(([k,txt])=>{ const b=document.createElement('button');
    b.className='btn ghost'; b.textContent=txt; b.dataset.k=k; b.onclick=()=>answer(k,b); btns.appendChild(b); });
  const next=()=>{
    answered=false;
    const root=ex.fixedRoot!=null?ex.fixedRoot:52+Math.floor(Math.random()*13);
    if(ex.mode==='duel'){
      let majFirst=Math.random()<.5, sol=majFirst?'1':'2';
      if(sol===prevSol && streakSol>=2){ majFirst=!majFirst; sol=majFirst?'1':'2'; }
      cur={root, a:majFirst?'maj':'min', b:majFirst?'min':'maj', sol};
    } else {
      let same=Math.random()<.5, sol=same?'same':'diff';
      if(sol===prevSol && streakSol>=2){ same=!same; sol=same?'same':'diff'; }
      const first=Math.random()<.5?'maj':'min';
      cur={root, a:first, b:same?first:(first==='maj'?'min':'maj'), sol};
    }
    streakSol = cur.sol===prevSol ? streakSol+1 : 1; prevSol=cur.sol;
    fb.textContent=''; fb.className='fb';
    btns.querySelectorAll('.btn').forEach(b=>{ b.classList.remove('ok'); b.style.pointerEvents='auto'; });
    progDots(dots,ex.count,i,badIdx);
    setTimeout(playPair,350);
  };
  const answer=(k,b)=>{
    if(answered) return; answered=true;
    btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
    const ok=(k===cur.sol);
    if(ok){ score++; b.classList.add('ok'); tada();
      fb.innerHTML=ex.mode==='duel'
        ? `✓ Oui : ① ${label[cur.a]} · ② ${label[cur.b]}`
        : `✓ Oui — ① ${label[cur.a]} · ② ${label[cur.b]}`;
      fb.className='fb ok';
    } else {
      buzz(); badIdx.add(i); errAdd('ear',{t:cur.a==='maj'?'min':'maj'});
      fb.innerHTML=`✗ ① était <b>${label[cur.a]}</b>, ② <b>${label[cur.b]}</b>. Réécoute en visant la <b>note du milieu</b> :`;
      fb.className='fb bad';
      btns.querySelector(`[data-k="${cur.sol}"]`).classList.add('ok');
      setTimeout(playPair,300);
    }
    setTimeout(()=>{ i++; if(i<ex.count) next(); else finish(); }, ok?1400:4000);
  };
  const finish=()=>{
    const pct=Math.round(score/ex.count*100);
    el.innerHTML=`<div class="exhead"><div class="target">${pct>=80?'👂':'🎧'} ${score}/${ex.count}</div>
      <div class="sub">${pct>=80?'Tu entends la différence. Monte d\'un cran.'
        :pct>=60?'Ça vient. Refais ce niveau : c\'est la répétition du CONTRASTE qui installe le repère.'
        :'Reste ici, ne monte pas. Utilise « ① seul » / « ② seul » et chante la note du milieu avant de répondre.'}</div></div>`;
    setTimeout(()=>cb(true,score),1500);
  };
  next();
}

/* ---------- moteur : NOMMER L'ACCORD ---------- */
function runNamer(el,ex,cb){

  el.innerHTML=`<div class="exhead"><div class="target">🕵️</div><div class="sub">${ex.sub||''}</div></div>

    <button class="btn small ghost" id="replay" style="display:block;margin:0 auto">🔊 Réécouter</button>

  el.querySelector('#kb').appendChild(kb);
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  let cur=null;
  const play=()=>{ if(cur) playChord(cur.v,1.5); };
  el.querySelector('#replay').onclick=play;
  const next=()=>{
    kb.clearSel();
    const root=Math.floor(Math.random()*12);
    const t=ex.types[Math.floor(Math.random()*ex.types.length)];
    cur={root,t,v:voicingFor(root,t)};
    cur.v.forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
    const good=chordName(root,t);
    const opts=new Set([good]);
    while(opts.size<4){
      const r2=Math.floor(Math.random()*12), t2=ex.types[Math.floor(Math.random()*ex.types.length)];
      opts.add(chordName(r2,t2));
    }
    btns.innerHTML='';
    [...opts].sort(()=>Math.random()-.5).forEach(o=>{

        else { buzz(); badIdx.add(i); fb.textContent='✗ C\'était '+good+' : '+chordNotes(root,t); fb.className='fb bad';
          [...btns.querySelectorAll('.btn')].find(x=>x.textContent===good).classList.add('ok'); }
        setTimeout(()=>{ i++; if(i<ex.count) next(); else fin(); },1400);
      };
      btns.appendChild(b);
    });
    fb.textContent=''; fb.className='fb';
    progDots(dots,ex.count,i,badIdx);
    setTimeout(play,300);
  };
  const fin=()=>{
    el.innerHTML=`<div class="exhead"><div class="target">🕵️ ${score}/${ex.count}</div>
      <div class="sub">${score===ex.count?'Rien ne t\'échappe.':'Les ratés : reconstruis-les avec la formule, pas de par-cœur.'}</div></div>`;
    setTimeout(()=>cb(true,score),1200);
  };
  next();
}

/* ---------- moteur : PRATIQUE (vrai piano) ---------- */
/* ---------- moteur : LE DÉCOUPLEUR (indépendance des mains) ----------
   L'app joue le vamp main gauche (le pouls) ; l'élève tape les rythmes main
   droite sur un pad, jugés contre l'horloge AUDIO (±200 ms). Cinq niveaux de
   superposition : avec le pouls → backbeat → blanches → contretemps → syncope. */
const DC_LEVELS=[
  {name:'Avec la gauche',   desc:'Tape sur CHAQUE temps, pile avec la basse. Les deux mains disent la même chose — c\'est le point de départ.', hits:[0,1,2,3]},
  {name:'Le backbeat',      desc:'Temps 2 et 4 seulement. Ta droite claque là où la batterie mettrait la caisse claire.', hits:[1,3]},
  {name:'Les blanches',     desc:'Temps 1 et 3 : moins de notes que la gauche. Résiste à l\'aspiration du pouls.', hits:[0,2]},
  {name:'Les contretemps',  desc:'Uniquement ENTRE les basses — les « et ». Le niveau qui fabrique l\'indépendance. Dis « 1 ET 2 ET » à voix haute.', hits:[.5,1.5,2.5,3.5]},
  {name:'La syncope',       desc:'1, « et » de 2, 4. Ta première vraie phrase rythmique par-dessus le vamp — le son des disques.', hits:[0,1.5,3]}
];
/* logique pure du jugement : chaque cible consomme la frappe la plus proche
   dans la fenêtre ; le reste des frappes = « en trop ». Testable à sec. */
function dcJudge(expected,taps,WIN){
  taps=[...taps]; let good=0;
  expected.forEach(t=>{
    let bi=-1,bd=WIN;
    taps.forEach((tt,i)=>{ const d=Math.abs(tt-t); if(d<=bd){ bd=d; bi=i; } });
    if(bi>=0){ good++; taps.splice(bi,1); }
  });
  return {good, extras:taps.length, total:expected.length,
          pass: good>=Math.ceil(expected.length*.8)&&taps.length<=2};
}
function runDecouple(el,ex,cb){
  const bpm=ex.bpm||66, beat=60/bpm, BARS=4, WIN=.2;
  const prog=[{root:9,type:'min'},{root:7},{root:5},{root:7}];
  let lvl=0, D=null;
  const html=()=>{
    const L=DC_LEVELS[lvl];
    el.innerHTML=`<div class="exhead"><div class="target">Niveau ${lvl+1}/${DC_LEVELS.length} — ${L.name}</div>
      <div class="sub">${L.desc}</div></div>
      <div id="dcGrid" style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:14px 0">
        ${[0,.5,1,1.5,2,2.5,3,3.5].map(p=>`<div data-p="${p}" style="text-align:center;padding:10px 2px;border-radius:9px;font-weight:800;font-size:13px;
          background:${L.hits.includes(p)?'var(--accent2)':'var(--bg3)'};color:${L.hits.includes(p)?'#1a1200':'var(--dim)'};
          border:1px solid ${L.hits.includes(p)?'var(--accent)':'var(--line)'}">${p%1===0?(p+1):'&'}</div>`).join('')}
      </div>
      <div class="fb" id="dcFb" style="min-height:22px"></div>
      <button class="btn" id="dcGo">▶ C'est parti — 1 mesure de décompte, 4 mesures jugées</button>
      <button id="dcPad" style="display:block;width:100%;margin-top:10px;padding:34px 0;border-radius:16px;border:2px solid var(--accent);
        background:var(--bg2);color:var(--accent);font-size:19px;font-weight:900;cursor:pointer;-webkit-user-select:none;user-select:none">🖐️ TAPE ICI<br><span style="font-size:11px;font-weight:700;color:var(--dim)">ta main droite, sur les cases orange</span></button>`;
    el.querySelector('#dcGo').onclick=start;
    const pad=el.querySelector('#dcPad');
    pad.addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
  };
  const start=()=>{
    const ctx=ac(), L=DC_LEVELS[lvl];
    const t0=ctx.currentTime+.25+4*beat;                 // début du jugement (après 1 mesure de décompte)
    // décompte : 4 clics
    for(let b=0;b<4;b++) Metro.click(ctx.currentTime+.25+b*beat, b===0);
    // vamp main gauche : 4 mesures d'octaves pulsées
    prog.forEach((ch,bar)=>{ const bass=36+(ch.root%12);
      for(let b=0;b<4;b++){ const tt=t0-ctx.currentTime+bar*4*beat+b*beat;
        playNote(bass,beat*.85,.46,tt); playNote(bass+12,beat*.85,.3,tt+.012); } });
    // cibles attendues sur l'horloge audio
    const expected=[];
    for(let bar=0;bar<BARS;bar++) L.hits.forEach(p=>expected.push(t0+(bar*4+p)*beat));
    D={t0,expected,taps:[],raf:null,end:t0+BARS*4*beat+WIN+.05};
    const fb=el.querySelector('#dcFb'); fb.textContent='Décompte…'; fb.className='fb';
    const go=el.querySelector('#dcGo'); go.disabled=true;
    // le verdict est planifié en temps, PAS dans la boucle d'affichage :
    // un rAF suspendu (onglet en fond, écran verrouillé) ne doit pas avaler le jugement
    setTimeout(()=>{ if(D&&el.isConnected) judge(); },(D.end-ctx.currentTime)*1000+120);
    setTimeout(()=>{ if(D&&el.isConnected&&fb.isConnected) fb.textContent='Joue !'; },(t0-ctx.currentTime)*1000);
    const loop=()=>{ if(!D||!el.isConnected) return;
      const now=ctx.currentTime, pos=(now-D.t0)/beat;
      el.querySelectorAll('#dcGrid div').forEach(c=>{
        const p=+c.dataset.p, inBar=((pos%4)+4)%4;
        c.style.outline=(pos>=0&&Math.abs(inBar-p)<.25)?'2px solid var(--txt)':'none';
      });
      D.raf=requestAnimationFrame(loop);
    };
    loop();
  };
  const tap=()=>{
    playNote(69,.5,.45);
    if(!D) return;
    D.taps.push(ac().currentTime);
    const pad=el.querySelector('#dcPad');
    pad.style.background='var(--accent2)'; setTimeout(()=>{ if(pad.isConnected) pad.style.background='var(--bg2)'; },90);
  };
  const judge=()=>{
    const v=dcJudge(D.expected,D.taps,WIN);
    const good=v.good, extras=v.extras, total=v.total, pass=v.pass;
    D=null;
    const fb=el.querySelector('#dcFb');
    if(pass){
      tada();
      if(lvl>=DC_LEVELS.length-1){
        el.innerHTML=`<div class="exhead"><div class="target">🥋 ${good}/${total}</div>
          <div class="sub">Cinq niveaux de superposition tenus. Ce que tu appelles « séparer les mains » vient de se produire : ta gauche est un pilote automatique, ta droite parle par-dessus. Transfère au vrai piano ce soir — mêmes niveaux, mêmes règles.</div></div>`;
        setTimeout(()=>cb(true),1400);
      } else {
        lvl++;
        fb.textContent='';
        el.querySelector('#dcGo').disabled=false;
        html();
        el.querySelector('#dcFb').innerHTML=`<span style="color:var(--good)">✓ ${good}/${total}${extras?` (${extras} en trop)`:''} — niveau suivant.</span>`;
      }
    } else {
      buzz();
      html();
      el.querySelector('#dcFb').innerHTML=`<span style="color:var(--bad)">✗ ${good}/${total} dans la fenêtre${extras?`, ${extras} tape${extras>1?'s':''} en trop`:''}.</span> ${good<total*.5?'Compte à VOIX HAUTE (« 1 et 2 et… ») — la bouche synchronise les mains.':'Presque. Écoute la basse, ne la regarde pas.'}`;
    }
  };
  html();
}

/* logique pure du mode « À toi de jouer » : une frappe → une décision.
   st={pos,wrong,done} muté ; renvoie l'action à jouer côté UI. */
function practiceTap(st, seq, midi){
  if(st.done) return {a:'free'};
  const exp=seq[st.pos].midi;
  if(midi===exp){
    st.pos++;
    if(st.pos>=seq.length){ st.done=true; return {a:'finish'}; }
    return {a:'ok'};
  }
  st.wrong++;
  return {a:'bad', exp};
}

/* ---------------- moteur play-along ---------------- */
const Player = {
  song:null, hands:'both', rate:1, loop:false, click:false, playing:false,
  ctx:null, timer:null, raf:null, anchorTime:0, anchorBeat:0, ai:0, spb:0,
  ae:[], melTL:[], chTL:[], total:0, kb:null, els:{}, onEnd:null, awarded:false,
  build(){
    const s=this.song;
    this.melTL=[]; let t=0;
    s.mel.forEach(([m,d])=>{ if(m!=null) this.melTL.push({t0:t,t1:t+d,midi:m}); t+=d; });
    const melBeats=t;
    this.chTL=[]; t=0;
    s.ch.forEach(([root,type])=>{ this.chTL.push({t0:t,t1:t+s.ts,root,type,label:chordName(root,type),notes:chordNotes(root,type)}); t+=s.ts; });
    const chBeats=t;
    this.total=Math.max(melBeats,chBeats)||chBeats;
    /* événements audio */
    const ae=[];
    if(this.hands!=='accomp') this.melTL.forEach(e=>ae.push({t:e.t0, midi:e.midi, dur:e.t1-e.t0, vel:.42}));
    if(this.hands!=='melody') this.chTL.forEach(c=>{
      /* basse : temps 1 (+ quinte au temps 3 en 4/4) */
      ae.push({t:c.t0, midi:36+c.root, dur:s.ts*.7, vel:.4});
      if(s.ts>=4) ae.push({t:c.t0+2, midi:36+((c.root+7)%12), dur:1.8, vel:.34});
      /* accord : 1 & 3 en binaire, « pah-pah » sur 2 & 3 en valse (3/4) */
      const compBeats = s.ts>=4 ? [0,2] : (s.ts===3 ? [1,2] : [0]);
      voicingFor(c.root,c.type).forEach(m=> compBeats.forEach(bt=> ae.push({t:c.t0+bt, midi:m, dur:1.3, vel:.15})));
    });
    if(this.click) for(let b=0;b<this.total;b++) ae.push({t:b, click:true, accent:b%s.ts===0});
    ae.sort((a,b)=>a.t-b.t);
    this.ae=ae;
  },
  start(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    this.playing=false; this._lastStrip=-1;
    this.build();
    const ctx=ac(); this.ctx=ctx;
    this.spb=60/(this.song.bpm*this.rate);
    /* décompte : une mesure de clics avant le morceau */
    const t0=ctx.currentTime+.14, ci=this.song.ts;
    for(let i=0;i<ci;i++) Metro.click(t0+i*this.spb, i===0);
    this.anchorTime=t0+ci*this.spb; this.anchorBeat=0; this.ai=0;
    this.playing=true; this.awarded=false;
    this.timer=setInterval(()=>this._sched(),25);
    this._frame();
    if(this.els.play) this.els.play.textContent='⏸ Stop';
  },
  _sched(){
    if(!this.playing) return;
    const ctx=this.ctx, look=.13, spb=this.spb;
    while(this.ai<this.ae.length){
      const ev=this.ae[this.ai], when=this.anchorTime+(ev.t-this.anchorBeat)*spb;
      if(when<ctx.currentTime+look){
        if(when>ctx.currentTime-.06){
          if(ev.click) Metro.click(when, ev.accent);
          else playNote(ev.midi, Math.max(.14,ev.dur*spb*.9), ev.vel, when-ctx.currentTime);
        }
        this.ai++;
      } else return;
    }
    const endT=this.anchorTime+(this.total-this.anchorBeat)*spb;
    if(ctx.currentTime>=endT-.02){
      if(this.loop){ this.anchorBeat=0; this.anchorTime=endT; this.ai=0; }
      else this.stop(true);
    }
  },
  _frame(){
    if(!this.playing) return;
    const beat=(this.ctx.currentTime-this.anchorTime)/this.spb+this.anchorBeat;
    const counting=beat<0;
    const bb=counting?0:(this.loop ? (beat%this.total) : Math.min(beat,this.total-.0001));
    if(this.kb){
      this.kb.clearSel();
      const chord=this.chTL.find(e=>bb>=e.t0&&bb<e.t1)||this.chTL[this.chTL.length-1];
      if(chord){
        [36+chord.root, ...voicingFor(chord.root,chord.type)].forEach(m=>{ const k=this.kb.keyEl(m); if(k) k.classList.add('hint'); });
        this._strip(this.chTL.indexOf(chord));
        if(this.els.cn){
          if(counting){ this.els.cn.textContent='· '+Math.max(1,Math.ceil(-beat))+' ·'; this.els.nn.textContent='Prêt…'; }
          else { this.els.cn.textContent=chord.label; this.els.nn.textContent=chord.notes; }
        }
      }
      if(!counting && this.hands!=='accomp'){
        const cur=this.melTL.find(e=>bb>=e.t0&&bb<e.t1);
        if(cur){ const k=this.kb.keyEl(cur.midi); if(k){ k.classList.remove('hint'); k.classList.add('sel'); } }
      }
    }
    if(this.els.bar) this.els.bar.style.width=Math.min(100,Math.max(0,beat)/this.total*100)+'%';
    this.raf=requestAnimationFrame(()=>this._frame());
  },
  _strip(idx){
    if(this._lastStrip===idx || !this.els.strip) return;
    this._lastStrip=idx;
    const chips=this.els.strip.children;
    for(let i=0;i<chips.length;i++) chips[i].classList.toggle('cur',i===idx);
    const cur=chips[idx]; if(cur) cur.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  },
  stop(natural){
    const wasPlaying=this.playing;
    this.playing=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    if(this.kb) this.kb.clearSel();
    this._lastStrip=-1;
    if(this.els.play) this.els.play.textContent='▶ Jouer';
    if(!wasPlaying || !this.song) return;
    const played=(this.ctx.currentTime-this.anchorTime)/this.spb+this.anchorBeat;
    if(this.song.jam){
      if(played>=8 && !this.awarded){ this.awarded=true; award(8); dailyMark('song'); toast('🎶 Jam validé · +8 XP'); }
    } else if(natural){
      const id=this.song.id, first=!S.songs[id];
      S.songs[id]=(S.songs[id]||0)+1; save();
      award(first?15:5); chime(); dailyMark('song');
      toast(first?'🎉 Morceau joué en entier · +15 XP':'↻ Rejoué · +5 XP');
      if(this.els.bar) this.els.bar.style.width='100%';
    }
    if(this.onEnd) this.onEnd();
  }
};
