const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* quiz « gymnastique » : X tel mode → quelle gamme majeure jouer ? (réponses calculées) */
function genGymQs(n){
  const qs=[], roots=[0,2,4,5,7,9,11,10];   /* blanches + Sib : parentes propres */
  const mk=(q,good,others,why)=>{ const o=[good,...others].sort(()=>Math.random()-.5); return {q,opts:o,a:o.indexOf(good),why}; };
  let guard=0;
  while(qs.length<n && guard++<200){
    const M=MODES[1+Math.floor(Math.random()*6)];         /* dorien..locrien (ionien trivial) */
    const rootPc=roots[Math.floor(Math.random()*roots.length)];
    const parent=(rootPc-MAJ_DEG_PC[M.deg-1]+24)%12;
    const good=NOTE_FR[parent]+' majeur';
    const others=[]; const cand=[rootPc,(parent+7)%12,(parent+5)%12,(parent+2)%12,(parent+9)%12];
    for(const p of cand){ if(others.length>=3)break; const nm=NOTE_FR[p]+' majeur'; if(nm!==good && !others.includes(nm)) others.push(nm); }
    qs.push(mk(`Tu improvises en <b>${NOTE_FR[rootPc]} ${M.nom}</b>. Quelle gamme <b>MAJEURE</b> joues-tu (en gravitant autour de ${NOTE_FR[rootPc]}) ?`,
      good, others,
      `${cap(M.nom)} = degré ${M.deg}. ${NOTE_FR[rootPc]} est le degré ${M.deg} de <b>${NOTE_FR[parent]} majeur</b> → joue ${NOTE_FR[parent]} majeur, mais fais du ${NOTE_FR[rootPc]} ta maison.`));
  }
  return qs;
}

const VL_KEYS=[0,2,5,7,9];
function vlCycle(key){
  return Math.random()<.5
    ? [{root:key,t:'maj'},{root:(key+5)%12,t:'maj',bass:key},{root:(key+7)%12,t:'maj',bass:(key+11)%12},{root:key,t:'maj'}]
    : [{root:key,t:'maj'},{root:(key+9)%12,t:'min',bass:key},{root:(key+5)%12,t:'maj',bass:key},{root:(key+7)%12,t:'maj',bass:(key+11)%12},{root:key,t:'maj'}];

/* ================================================================
   PIANO CONNECTÉ (MIDI) — l'app entend directement ce que tu joues
   Avec un piano numérique branché en USB, la détection est EXACTE :
   ce ne sont pas des sons analysés, ce sont les notes elles-mêmes.
   ================================================================ */
/* modèles d'accords : ensemble d'intervalles (depuis la fondamentale) → nom.
   pri = priorité quand plusieurs lectures sont possibles (ambiguïté musicale). */
const MIDI_TPL = {
  '0,7':      {suf:'5',      fr:'quinte (power chord)', pri:5},
  '0,4,7':    {suf:'',       fr:'majeur',               pri:1},
  '0,3,7':    {suf:'m',      fr:'mineur',               pri:1},
  '0,3,6':    {suf:'dim',    fr:'diminué',              pri:3},
  '0,4,8':    {suf:'aug',    fr:'augmenté',             pri:3},
  '0,2,7':    {suf:'sus2',   fr:'sus2',                 pri:4},
  '0,5,7':    {suf:'sus4',   fr:'sus4',                 pri:4},
  '0,4,7,11': {suf:'maj7',   fr:'majeur 7',             pri:2},
  '0,4,7,10': {suf:'7',      fr:'7 (dominante)',        pri:2},
  '0,3,7,10': {suf:'m7',     fr:'mineur 7',             pri:2},
  '0,3,7,11': {suf:'m(maj7)',fr:'mineur majeur 7',      pri:4},
  '0,3,6,10': {suf:'m7♭5',   fr:'demi-diminué',         pri:3},
  '0,3,6,9':  {suf:'°7',     fr:'diminué 7',            pri:3},
  '0,4,7,9':  {suf:'6',      fr:'sixte',                pri:3},
  '0,3,7,9':  {suf:'m6',     fr:'mineur 6',             pri:3},
  '0,2,4,7':  {suf:'add9',   fr:'add9',                 pri:4},
  '0,5,7,10': {suf:'7sus4',  fr:'7sus4',                pri:4},
  '0,2,4,7,10':{suf:'9',     fr:'neuvième',             pri:4},
  '0,2,4,7,11':{suf:'maj9',  fr:'majeur 9',             pri:4},
  '0,2,3,7,10':{suf:'m9',    fr:'mineur 9',             pri:4},
};
const IV_NAME = {1:'seconde mineure',2:'seconde majeure',3:'tierce mineure',4:'tierce majeure',
  5:'quarte',6:'triton',7:'quinte',8:'sixte mineure',9:'sixte majeure',10:'septième mineure',11:'septième majeure'};

/* identifie un accord depuis des notes MIDI absolues. Détection exacte :
   les seules ambiguïtés sont musicales (Do6 vs Lam7), pas techniques. */
function identifyChord(midiNotes){
  const notes=[...new Set(midiNotes)].sort((a,b)=>a-b);
  if(!notes.length) return null;
  const bass=notes[0]%12;
  const pcs=[...new Set(notes.map(n=>n%12))].sort((a,b)=>a-b);
  if(pcs.length===1) return {sym:NOTE[pcs[0]], fr:NOTE_FR[pcs[0]]+' (note seule)', pcs, bass, kind:'note'};
  if(pcs.length===2){
    const iv=(pcs[1]-pcs[0]+12)%12;
    if(iv===7||iv===5){ const root=iv===7?pcs[0]:pcs[1];
      return {sym:NOTE[root]+'5', fr:NOTE_FR[root]+' quinte (power chord)', pcs, bass, kind:'dyad'}; }
    return {sym:NOTE[bass]+' + '+IV_NAME[iv], fr:'intervalle : '+IV_NAME[iv], pcs, bass, kind:'dyad'};
  }
  const cands=[];
  for(const root of pcs){
    const key=pcs.map(p=>(p-root+12)%12).sort((a,b)=>a-b).join(',');
    const tpl=MIDI_TPL[key];
    if(tpl) cands.push({root,tpl,bassIsRoot:root===bass});
  }
  if(!cands.length) return {sym:'—', fr:'accord non standard ('+pcs.map(p=>NOTE[p]).join(' ')+')', pcs, bass, kind:'unknown'};
  cands.sort((a,b)=> (b.bassIsRoot-a.bassIsRoot) || (a.tpl.pri-b.tpl.pri) || (a.root-b.root));
  const c=cands[0], slash=(c.root!==bass);
  return {
    sym:NOTE[c.root]+c.tpl.suf+(slash?'/'+NOTE[bass]:''),
    fr:NOTE_FR[c.root]+' '+c.tpl.fr+(slash?' (renversement, basse '+NOTE_FR[bass]+')':''),
    root:c.root, bass, pcs, kind:'chord',
    alt: cands.length>1 ? NOTE[cands[1].root]+cands[1].tpl.suf : null
  };
}

/* ---- plomberie Web MIDI ---- */
const MIDIN={access:null, held:new Set(), inputs:[], onUpdate:null, onDevices:null};
async function midiConnect(){
  if(!navigator.requestMIDIAccess) return {ok:false, reason:'no-api'};
  try{
    const access=await navigator.requestMIDIAccess({sysex:false});
    MIDIN.access=access;
    const bind=()=>{ MIDIN.inputs=[...access.inputs.values()];
      MIDIN.inputs.forEach(inp=>inp.onmidimessage=onMidiMsg);
      if(MIDIN.onDevices) MIDIN.onDevices(MIDIN.inputs); };
    access.onstatechange=bind; bind();
    return {ok:true};
  }catch(e){ return {ok:false, reason:'denied'}; }
}
function onMidiMsg(e){
  const [st,note,vel]=e.data, cmd=st&0xf0;
  if(cmd===0x90 && vel>0) MIDIN.held.add(note);
  else if(cmd===0x80 || (cmd===0x90 && vel===0)) MIDIN.held.delete(note);
  else return;
  if(MIDIN.onUpdate) MIDIN.onUpdate([...MIDIN.held].sort((a,b)=>a-b));
}
/* hook de test : simule un message MIDI sans matériel */
function midiSimulate(bytes){ onMidiMsg({data:bytes}); }

function openMidi(){
  openCustom('🎹 Piano connecté',(inner)=>{
    inner.innerHTML=`
      <div class="card" id="midiStatus"><b style="font-size:15px">🔌 Connexion…</b>
        <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Recherche d'un piano MIDI.</p></div>
      <div class="exhead"><div class="target" id="midiChord" style="font-size:40px">—</div>
        <div class="sub" id="midiFr">Joue un accord sur ton piano.</div>
        <div class="sub" id="midiAlt" style="color:var(--blue);margin-top:4px"></div></div>
      <div id="midiKb"></div>
      <div class="theory"><div class="tip" style="margin-top:12px">💡 La détection est <b>exacte</b> : ce sont les vraies notes envoyées par ton piano, pas du son analysé. Les seules « hésitations » possibles sont des ambiguïtés de théorie (un Do6 et un Lam7 ont les mêmes notes) — l'app choisit selon la basse.</div></div>`;
    const kb=buildKeyboard(36,84,()=>{}); inner.querySelector('#midiKb').appendChild(kb);
    const statusEl=inner.querySelector('#midiStatus'), chordEl=inner.querySelector('#midiChord'),
          frEl=inner.querySelector('#midiFr'), altEl=inner.querySelector('#midiAlt');
    const setStatus=(html)=>statusEl.innerHTML=html;

    MIDIN.onDevices=(inputs)=>{
      if(inputs.length) setStatus(`<b style="font-size:15px;color:var(--ok)">🎹 Connecté : ${inputs.map(i=>i.name).join(', ')}</b>
        <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Joue — l'app identifie en direct.</p>`);
      else setStatus(`<b style="font-size:15px;color:var(--acc)">Aucun piano MIDI détecté</b>
        <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Branche ton piano à l'ordinateur avec un câble <b>USB</b> (prise « USB TO HOST » à l'arrière du piano), puis rejoue. Si ton piano n'a qu'une vieille prise MIDI ronde à 5 broches, il faut un petit adaptateur MIDI→USB.</p>`);
    };
    MIDIN.onUpdate=(held)=>{
      kb.clearSel();
      held.forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('sel'); });
      const r=identifyChord(held);
      if(!r){ chordEl.textContent='—'; frEl.textContent='Joue un accord sur ton piano.'; altEl.textContent=''; return; }
      chordEl.textContent=r.sym; frEl.textContent=r.fr;
      altEl.textContent = r.alt ? 'aussi lisible : '+r.alt : '';
    };
    midiConnect().then(res=>{
      if(!res.ok && res.reason==='no-api')
        setStatus(`<b style="font-size:15px;color:var(--bad)">Web MIDI indisponible</b>
          <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Ton navigateur ne gère pas le MIDI (c'est le cas de Safari et de tout iPhone). Ouvre Piano Dojo dans <b>Chrome ou Edge sur ordinateur</b> pour cette fonction.</p>`);
      else if(!res.ok)
        setStatus(`<b style="font-size:15px;color:var(--bad)">Accès MIDI refusé</b>
          <p style="color:var(--dim);font-size:13px;margin:4px 0 0">Autorise l'accès MIDI puis recharge la page.</p>`);
      else if(!MIDIN.inputs.length) MIDIN.onDevices([]);
    });
  });
}

/* ================================================================

   ================================================================ */
const overlay=document.getElementById('overlay');
const overlayInner=document.getElementById('overlayInner');
function closeOverlay(){ overlay.classList.remove('open'); Metro.stop(); Player.stop(false); if(typeof CoordPlayer!=='undefined')CoordPlayer.stop(); render(); }
function openCustom(title,fill){
  overlayInner.innerHTML=`<div class="topbar"><button class="back">←</button><b>${title}</b></div>`;
  overlayInner.querySelector('.back').onclick=closeOverlay;
  overlay.classList.add('open'); overlay.scrollTop=0;
  fill(overlayInner, closeOverlay);
}
function openLesson(l){
  openCustom(l.title,(inner)=>{
    const th=document.createElement('div'); th.className='theory'; th.innerHTML=l.theory;
    inner.appendChild(th);
    const vq=l.video||(l.title+' piano débutant sans solfège');
    const vl=document.createElement('a');
    vl.href='https://www.youtube.com/results?search_query='+encodeURIComponent(vq);
    vl.target='_blank'; vl.rel='noopener noreferrer';
    vl.className='btn ghost'; vl.style.textDecoration='none'; vl.style.display='block';
    vl.textContent='▶️ Voir des vidéos sur ce thème';
    th.appendChild(vl);
    const go=document.createElement('button'); go.className='btn';
    go.textContent= S.done[l.id] ? '↻ Refaire l\'exercice (+10 XP)' : '⚔️ Passer à la pratique';
    inner.appendChild(go);
    go.onclick=()=>{
      th.remove(); go.remove();
      const exDiv=document.createElement('div'); inner.appendChild(exDiv);
      const doneCb=(success)=>{
        if(!success){ closeOverlay(); return; }
        chime();
        /* travail libre : une leçon se valide en un passage propre, quand tu veux.
           Déjà validée → révision. Tu choisis ton programme chaque jour. */
        if(S.done[l.id]){ award(10); toast('↻ Révision · +10 XP'); }
        else {
          S.done[l.id]=true;
          const p=progOf(l.id); p.n++; p.last=todayStr(); S.prog[l.id]=p; save();
          award(l.xp); tada();
          toast(`🥋 Leçon validée · +${l.xp} XP`);
        }
        dailyMark('lesson');
        if(l.ex.type==='ear') dailyMark('ear');
        setTimeout(closeOverlay,600);
      };
      /* exercices générés à la volée (questions/gammes tirées à chaque passage) */
      const ex = l.ex.qsGen ? {...l.ex, qs:l.ex.qsGen()}
               : l.ex.exGen ? {...l.ex, ...l.ex.exGen()}
               : l.ex;
      if(ex.type==='quiz') runQuiz(exDiv,ex,doneCb);
      else if(ex.type==='chord') runChord(exDiv,ex,doneCb);
      else if(ex.type==='prog') runProg(exDiv,ex,doneCb);
      else if(ex.type==='scale') runScale(exDiv,ex,doneCb);
      else if(ex.type==='ear') runEar(exDiv,ex,doneCb);
      else if(ex.type==='practice') runPractice(exDiv,ex,doneCb);
    };
  });
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200);
}
function progDots(el,total,idx,badIdx=new Set()){
  el.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('i');
    if(badIdx.has(i)) d.className='bad'; else if(i<idx) d.className='on';
    el.appendChild(d);
  }
}

/* ---------- moteur : QUIZ ---------- */
function runQuiz(el,ex,cb){
  let i=0, wrong=0;
  const show=()=>{
    const q=ex.qs[i];
    el.innerHTML=`<div class="exhead"><div class="sub">Question ${i+1}/${ex.qs.length}</div>
      <div style="font-size:18px;font-weight:700;margin:8px 0 14px">${q.q}</div></div>`;
    const dots=document.createElement('div'); dots.className='exprog'; el.appendChild(dots);
    progDots(dots,ex.qs.length,i);
    q.opts.forEach((o,oi)=>{
      const b=document.createElement('button'); b.className='quizopt'; b.textContent=o;
      b.onclick=()=>{
        el.querySelectorAll('.quizopt').forEach(x=>x.style.pointerEvents='none');
        const correct = (oi===q.a);
        if(correct){ b.classList.add('right'); tada(); }
        else { b.classList.add('wrong'); wrong++; buzz();
          if(!ex.noLog) errAdd('quiz',q);
          el.querySelectorAll('.quizopt')[q.a].classList.add('right'); }
        /* format Anki : la correction + la théorie ne s'affichent que si tu te trompes.
           (En QCM, si l'explication apparaît à chaque fois, elle finit par te souffler la réponse.) */
        const card=document.createElement('div'); card.className='quizwhy';
        if(correct){ card.innerHTML='<b style="color:var(--ok)">✓ Juste.</b>'; }
        else {
          card.style.borderColor='var(--bad)';
          card.innerHTML=`<div style="font-weight:800;color:var(--bad);margin-bottom:6px">✗ La réponse : <span style="color:var(--ok)">${q.opts[q.a]}</span></div>
            <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:var(--acc);margin-bottom:3px">📇 À RETENIR</div>
            <div style="line-height:1.5">${q.why}</div>`;
        }
        el.appendChild(card);
        const nx=document.createElement('button'); nx.className='btn';
        nx.textContent= i+1<ex.qs.length ? 'Suivant →' : 'Terminer';
        nx.onclick=()=>{ i++; if(i<ex.qs.length) show(); else finish(); };
        el.appendChild(nx);
      };
      el.appendChild(b);
    });
  };
  const finish=()=>{
    const score=ex.qs.length-wrong;
    if(ex.scored){
      el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Section notée.</div></div>`;
      setTimeout(()=>cb(true,score),900); return;
    }
    if(wrong===0) el.innerHTML=`<div class="exhead"><div class="target">🎯 ${score}/${ex.qs.length}</div><div class="sub">Sans faute. C'est comme ça qu'on travaille.</div></div>`;
    else if(score>=Math.ceil(ex.qs.length*0.6)) el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Validé — mais relis les explications des erreurs avant de partir.</div></div>`;
    else { el.innerHTML=`<div class="exhead"><div class="target">${score}/${ex.qs.length}</div><div class="sub">Insuffisant. Relis la théorie et reviens : la base doit être solide.</div></div>`;
      const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ i=0; wrong=0; show(); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true),1200);
  };
  show();
}

/* ---------- moteur : ACCORDS ---------- */
function genChordItems(gen){
  const items=[]; const used=new Set();
  while(items.length<gen.count){
    const root=gen.roots[Math.floor(Math.random()*gen.roots.length)];
    const t=gen.types[Math.floor(Math.random()*gen.types.length)];
    const k=root+t; if(used.has(k)) continue; used.add(k);
    items.push({root,t});
  }
  return items;
}
function runChord(el,ex,cb){
  const items = ex.items || genChordItems(ex.gen);
  const pass = ex.pass || items.length;
  let i=0, fails=0, score=0, advancing=false; const badIdx=new Set(), failedItems=new Set();
  const sel=new Set();
  el.innerHTML=`<div class="exhead"><div class="target" id="tgt"></div><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="listen" style="margin-top:8px">🔊 Écouter la cible</button></div>
    <div class="exprog" id="dots"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>`;
  el.querySelector('#listen').onclick=()=>{
    const it=items[i]; if(it) playChord(it.hint||voicingFor(it.root,it.t,it.bass),1.6);
  };
  const kb=buildKeyboard(48,72,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const tgt=el.querySelector('#tgt'), fb=el.querySelector('#fb'), dots=el.querySelector('#dots');
  const show=()=>{
    const it=items[i]; sel.clear(); kb.clearSel(); advancing=false;
    tgt.textContent=it.label||chordName(it.root,it.t,it.bass);
    fb.textContent=''; fb.className='fb'; fails=0;
    progDots(dots,items.length,i,badIdx);
  };
  const check=()=>{
    if(advancing) return; /* anti double-validation pendant la fenêtre de succès */
    const it=items[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=(it.iv||CHORD_TYPES[it.t].iv).map(x=>(it.root+x)%12);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    let ok = pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok && it.bass!=null) ok = (Math.min(...sel)%12)===it.bass;
    if(ok){
      advancing=true; score++; playChord([...sel]); tada();
      fb.textContent='✓ '+(it.label||chordName(it.root,it.t))+' — '+(it.notesTxt||chordNotes(it.root,it.t)); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<items.length) show(); else finish(); },900);
    } else {
      fails++; failedItems.add(i);
      if(fails===1 && !ex.noLog) errAdd('chord', it);
      buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      if(fails===1) fb.textContent= it.msg1 || (it.bass!=null
        ? '✗ Vérifie les notes ET la basse (note la plus grave = '+NOTE[it.bass]+').'
        : '✗ Recompte : '+(CHORD_TYPES[it.t].iv.length>3?'4 notes.':'majeur = 4+3, mineur = 3+4.'));
      else if(fails===2) fb.textContent='✗ Les notes : '+(it.notesTxt||chordNotes(it.root,it.t));
      else {
        fb.textContent='Regarde les touches bleues, joue-les, et retiens le geste.';
        (it.hint||voicingFor(it.root,it.t,it.bass)).forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
      }
      fb.className='fb bad';
      if(fails>=3) badIdx.add(i);
    }
  };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=check;
  const finish=()=>{
    const okPass=score>=pass;
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'🥋':'👹'} ${score}/${items.length}</div>
      <div class="sub">${okPass ? (score===items.length?'Sans faute. Le dojo est fier.':'Validé. Les accords ratés : refais-les au vrai piano.')
      : 'En dessous de '+pass+'/'+items.length+'. On ne négocie pas avec les fondations : recommence.'}</div></div>`;
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runChord(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score,failedItems.size,failedItems,items),1300);
  };
  show();
}

/* ---------- moteur : PROGRESSION ---------- */
function runProg(el,ex,cb){
  const seq=[]; for(let r=0;r<ex.rounds;r++) seq.push(...ex.chords);
  let i=0, fails=0; const sel=new Set();
  el.innerHTML=`<div class="exhead"><div class="sub">${ex.sub||''}</div>
    <button class="btn small ghost" id="demo" style="margin-top:8px">🔊 Écouter la progression</button></div>
    <div class="chips" id="chips"></div><div id="kb"></div>
    <div class="fb" id="fb"></div>
    <div class="exrow"><button class="btn ghost" id="clr">Effacer</button><button class="btn" id="val">Valider</button></div>`;
  el.querySelector('#demo').onclick=()=>{
    ex.chords.forEach((c,ci)=>setTimeout(()=>playChord(voicingFor(c.root,c.t,ex.free?null:c.bass),1.1),ci*950));
  };
  const kb=buildKeyboard(48,72,(m,k)=>{
    if(sel.has(m)){ sel.delete(m); k.classList.remove('sel'); }
    else { sel.add(m); k.classList.add('sel'); playNote(m,.9); }
  });
  el.querySelector('#kb').appendChild(kb);
  const chips=el.querySelector('#chips'), fb=el.querySelector('#fb');
  const draw=()=>{
    chips.innerHTML='';
    seq.forEach((c,ci)=>{
      const s=document.createElement('div');
      s.className='chip'+(ci===i?' cur':ci<i?' done':'');
      s.textContent=chordName(c.root,c.t, ex.free?null:c.bass);
      chips.appendChild(s);
    });
  };
  const show=()=>{ sel.clear(); kb.clearSel(); fb.textContent=''; fb.className='fb'; fails=0; draw(); };
  el.querySelector('#clr').onclick=()=>{ sel.clear(); kb.clearSel(); };
  el.querySelector('#val').onclick=()=>{
    const c=seq[i];
    if(!sel.size){ fb.textContent='Sélectionne des touches d\'abord.'; fb.className='fb bad'; return; }
    const need=CHORD_TYPES[c.t].iv.map(x=>(c.root+x)%12);
    const pcs=[...new Set([...sel].map(m=>m%12))];
    let ok = pcs.length===need.length && need.every(p=>pcs.includes(p));
    if(ok && !ex.free && c.bass!=null) ok=(Math.min(...sel)%12)===c.bass;
    if(ok){
      playChord([...sel]); tada();
      fb.textContent='✓ '+chordName(c.root,c.t); fb.className='fb ok';
      setTimeout(()=>{ i++; if(i<seq.length) show(); else {
        el.innerHTML=`<div class="exhead"><div class="target">🌊</div>
          <div class="sub">Progression bouclée. Maintenant, la vraie version : au piano, en boucle, sans regarder.</div></div>`;
        setTimeout(()=>cb(true),1300);
      }},800);
    } else {
      fails++; buzz(); kb.kbd.classList.add('shake'); setTimeout(()=>kb.kbd.classList.remove('shake'),400);
      fb.textContent= fails>=2 ? '✗ '+chordName(c.root,c.t)+' = '+chordNotes(c.root,c.t)+(!ex.free&&c.bass!=null?' · basse : '+NOTE[c.bass]:'')
        : '✗ Pas ça. Construis-le calmement.';
      fb.className='fb bad';
    }
  };
  show();
}

/* ---------- moteur : GAMME ---------- */
function runScale(el,ex,cb){
  const pcSeq=ex.pattern.map(p=>(ex.root+p)%12);
  let idx=0, startMidi=null, resets=0;
  el.innerHTML=`<div class="exhead"><div class="target">${ex.name}</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div><div id="kb"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb');
  const kb=buildKeyboard(48,76,(m,k)=>{
    playNote(m,.8);
    if(idx===0 && m%12===pcSeq[0] && m+ex.pattern[ex.pattern.length-1]>76){
      fb.textContent='Bonne note, mais trop haut — le sommet sortirait du clavier. Commence plus grave.';
      fb.className='fb bad'; return;
    }
    const expected = idx===0 ? null : startMidi+ex.pattern[idx];
    const okTap = idx===0 ? (m%12===pcSeq[0]) : (m===expected);
    if(okTap){
      if(idx===0) startMidi=m;
      k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'),250);
      idx++;
      progDots(dots,ex.pattern.length,idx);
      if(idx>=ex.pattern.length){
        tada();
        fb.textContent='✓ Gamme complète.'; fb.className='fb ok';
        el.querySelectorAll('.key').forEach(x=>x.style.pointerEvents='none');
        setTimeout(()=>{
          el.innerHTML=`<div class="exhead"><div class="target">🪜</div>
          <div class="sub">Bien. Maintenant au vrai piano : la même, mains séparées, avec le bon doigté. Lentement.</div></div>`;
          setTimeout(()=>cb(true),1300);
        },800);
      } else {
        fb.textContent='Note '+(idx+1)+'/'+ex.pattern.length+' — la suivante est à '+(ex.pattern[idx]-ex.pattern[idx-1])+' demi-ton(s).';
        fb.className='fb';
      }
    } else {
      buzz(); resets++;
      idx=0; startMidi=null;
      progDots(dots,ex.pattern.length,0);
      fb.textContent= resets>=3
        ? '✗ On repart du début. Formule : '+ex.pattern.slice(1).map((p,j)=>p-ex.pattern[j]).join('-')
        : '✗ Mauvaise note — on repart de la première.';
      fb.className='fb bad';
    }
  });
  el.querySelector('#kb').appendChild(kb);
  progDots(dots,ex.pattern.length,0);
  fb.textContent='Commence sur '+NOTE[pcSeq[0]]+' ('+NOTE_FR[pcSeq[0]]+').';
}

/* ---------- moteur : OREILLE ---------- */
function runEar(el,ex,cb){
  let i=0, score=0, answered=false, cur=null, prevT=null, streakT=0; const badIdx=new Set();
  const label={maj:'Majeur',min:'Mineur',maj7:'maj7',m7:'m7',dom7:'7'};
  const third={maj:'tierce majeure — brillante (4 demi-tons)', min:'tierce mineure — sombre (3 demi-tons)'};
  el.innerHTML=`<div class="exhead"><div class="target">👂</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div>
    <div class="exrow"><button class="btn ghost" id="replay">🔊 Réécouter</button><button class="btn ghost" id="arp">🎵 Note par note</button></div>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  ex.kinds.forEach(k=>{
    const b=document.createElement('button'); b.className='btn ghost'; b.textContent=label[k]; b.dataset.k=k;
    b.onclick=()=>answer(k,b); btns.appendChild(b);
  });
  if(ex.kinds.length===3) btns.style.gridTemplateColumns='1fr 1fr 1fr';
  const notesOf=()=>{ const iv=CHORD_TYPES[cur.t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.rootMidi+x); };
  /* identification maj/min : on donne un REPÈRE (la fondamentale seule) avant l'accord
     égrené — pour juger la tierce PAR RAPPORT à une note qu'on vient d'entendre. */
  const isMM = ex.kinds.every(k=>k==='maj'||k==='min');
  const anchored = ex.anchor!==false && isMM && !ex.dyad && ex.fixedRoot==null;
  const playBlock=()=>{ if(cur) playChord(notesOf(),1.8, ex.dyad?0:.03); };
  const playArp=()=>{ if(cur) notesOf().forEach((m,idx)=>playNote(m,.75,.42,idx*.5)); };
  const playAnchored=()=>{ if(!cur) return; playNote(cur.rootMidi,1.0,.34); notesOf().forEach((m,idx)=>playNote(m,1.7,.4, 1.2+idx*.02)); };
  const play=()=> anchored?playAnchored() : (ex.arp?playArp():playBlock());
  el.querySelector('#replay').onclick=play;
  el.querySelector('#arp').onclick=playArp;
  if(anchored){ const sb=el.querySelector('.exhead .sub'); if(sb) sb.innerHTML='D\'abord la <b>fondamentale</b> (ton repère), puis l\'<b>accord plaqué</b>. Sonne-t-il brillant (majeur) ou sombre (mineur) ? Besoin d\'isoler la tierce ? « 🎵 Note par note ».'; el.querySelector('#replay').textContent='🔊 Repère + accord'; }
  const next=()=>{
    answered=false;
    const root = ex.fixedRoot!=null ? ex.fixedRoot : 52+Math.floor(Math.random()*13);
    let t=ex.kinds[Math.floor(Math.random()*ex.kinds.length)];
    if(t===prevT && streakT>=2 && ex.kinds.length>1){ const o=ex.kinds.filter(k=>k!==prevT); t=o[Math.floor(Math.random()*o.length)]; }
    streakT = t===prevT ? streakT+1 : 1; prevT=t;
    cur={ t, rootMidi:root };
    fb.textContent=''; fb.className='fb';
    btns.querySelectorAll('.btn').forEach(b=>{ b.classList.remove('ok'); b.style.opacity=1; b.style.pointerEvents='auto'; });
    progDots(dots,ex.count,i,badIdx);
    setTimeout(play,400);
  };
  const answer=(k,b)=>{
    if(answered) return; answered=true;
    btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
    const isTri = cur.t==='maj'||cur.t==='min';
    if(k===cur.t){ score++; b.classList.add('ok'); tada();
      fb.textContent='✓ '+label[cur.t]+(isTri?' · '+third[cur.t]:''); fb.className='fb ok'; }
    else { buzz(); badIdx.add(i);
      if(!ex.noLog) errAdd('ear',{t:cur.t});
      /* LE moment où on apprend : on rejoue CE QUE TU AS CRU, puis CE QUE C'ÉTAIT,
         sur la même fondamentale. Entendre le contraste vaut dix bonnes réponses. */
      fb.innerHTML=`✗ Tu as dit <b>${label[k]}</b>, c'était <b>${label[cur.t]}</b>. Écoute les deux à la suite :`;
      fb.className='fb bad';
      btns.querySelector(`[data-k="${cur.t}"]`).classList.add('ok');
      const notesFor=t=>{ const iv=CHORD_TYPES[t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.rootMidi+x); };
      notesFor(k).forEach((m,ix)=>playNote(m,1.2,.34,.35+ix*.03));
      notesFor(cur.t).forEach((m,ix)=>playNote(m,1.6,.42,2.05+ix*.03));
    }
    setTimeout(()=>{ i++; if(i<ex.count) next(); else finish(); }, k===cur.t?1200:4200);
  };
  const finish=()=>{
    const okPass=score>=(ex.pass||0);
    el.innerHTML=`<div class="exhead"><div class="target">${okPass?'👂':'😵'} ${score}/${ex.count}</div>
      <div class="sub">${okPass ? 'Ton oreille s\'ouvre. Reviens demain : elle progresse en dormant.'
        : 'En dessous de '+ex.pass+'/'+ex.count+'. Normal au début — réécoute chaque couleur, puis recommence.'}</div></div>`;
    if(score>S.earBest){ S.earBest=score; save(); }
    if(!okPass){ const rb=document.createElement('button'); rb.className='btn'; rb.textContent='↻ Recommencer';
      rb.onclick=()=>{ el.innerHTML=''; runEar(el,ex,cb); }; el.appendChild(rb); return; }
    setTimeout(()=>cb(true,score),1300);
  };
  next();
}

/* ---------- moteur : OREILLE A/B (comparaison) ----------
   Le barreau qui manquait. Identifier un accord seul (« c'est majeur ? »)
   exige un modèle interne. COMPARER deux accords n'en exige aucun : c'est
   ainsi qu'on FABRIQUE le modèle. On ne passe à l'absolu qu'après. */
function runEarAB(el,ex,cb){
  let i=0, score=0, answered=false, cur=null, prevSol=null, streakSol=0; const badIdx=new Set();
  const label={maj:'Majeur',min:'Mineur'};
  el.innerHTML=`<div class="exhead"><div class="target">${ex.mode==='duel'?'🅰️🅱️':'↔️'}</div>
    <div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div>
    <div class="exrow"><button class="btn ghost" id="rep">🔊 Les deux</button>
      <button class="btn ghost" id="r1">① seul</button><button class="btn ghost" id="r2">② seul</button></div>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  const notesOf=t=>{ const iv=CHORD_TYPES[t].iv; const use=ex.dyad?[iv[0],iv[1]]:iv; return use.map(x=>cur.root+x); };
  const playOne=(t,when)=>{ const n=notesOf(t);
    if(ex.arp) n.forEach((m,ix)=>playNote(m,.8,.4,when+ix*.4));
    else n.forEach((m,ix)=>playNote(m,1.5,.36,when+ix*.03)); };
  const gap=ex.arp?1.9:1.7;
  const playPair=()=>{ playOne(cur.a,.05); playOne(cur.b,gap); };
  el.querySelector('#rep').onclick=()=>cur&&playPair();
  el.querySelector('#r1').onclick=()=>cur&&playOne(cur.a,.05);
  el.querySelector('#r2').onclick=()=>cur&&playOne(cur.b,.05);
  const opts = ex.mode==='duel' ? [['1','① Le premier'],['2','② Le deuxième']]
                                : [['same','Pareils'],['diff','Différents']];
  opts.forEach(([k,txt])=>{ const b=document.createElement('button');
    b.className='btn ghost'; b.textContent=txt; b.dataset.k=k; b.onclick=()=>answer(k,b); btns.appendChild(b); });
  const next=()=>{
    answered=false;
    const root=ex.fixedRoot!=null?ex.fixedRoot:52+Math.floor(Math.random()*13);
    if(ex.mode==='duel'){
      let majFirst=Math.random()<.5, sol=majFirst?'1':'2';
      if(sol===prevSol && streakSol>=2){ majFirst=!majFirst; sol=majFirst?'1':'2'; }
      cur={root, a:majFirst?'maj':'min', b:majFirst?'min':'maj', sol};
    } else {
      let same=Math.random()<.5, sol=same?'same':'diff';
      if(sol===prevSol && streakSol>=2){ same=!same; sol=same?'same':'diff'; }
      const first=Math.random()<.5?'maj':'min';
      cur={root, a:first, b:same?first:(first==='maj'?'min':'maj'), sol};
    }
    streakSol = cur.sol===prevSol ? streakSol+1 : 1; prevSol=cur.sol;
    fb.textContent=''; fb.className='fb';
    btns.querySelectorAll('.btn').forEach(b=>{ b.classList.remove('ok'); b.style.pointerEvents='auto'; });
    progDots(dots,ex.count,i,badIdx);
    setTimeout(playPair,350);
  };
  const answer=(k,b)=>{
    if(answered) return; answered=true;
    btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
    const ok=(k===cur.sol);
    if(ok){ score++; b.classList.add('ok'); tada();
      fb.innerHTML=ex.mode==='duel'
        ? `✓ Oui : ① ${label[cur.a]} · ② ${label[cur.b]}`
        : `✓ Oui — ① ${label[cur.a]} · ② ${label[cur.b]}`;
      fb.className='fb ok';
    } else {
      buzz(); badIdx.add(i); errAdd('ear',{t:cur.a==='maj'?'min':'maj'});
      fb.innerHTML=`✗ ① était <b>${label[cur.a]}</b>, ② <b>${label[cur.b]}</b>. Réécoute en visant la <b>note du milieu</b> :`;
      fb.className='fb bad';
      btns.querySelector(`[data-k="${cur.sol}"]`).classList.add('ok');
      setTimeout(playPair,300);
    }
    setTimeout(()=>{ i++; if(i<ex.count) next(); else finish(); }, ok?1400:4000);
  };
  const finish=()=>{
    const pct=Math.round(score/ex.count*100);
    el.innerHTML=`<div class="exhead"><div class="target">${pct>=80?'👂':'🎧'} ${score}/${ex.count}</div>
      <div class="sub">${pct>=80?'Tu entends la différence. Monte d\'un cran.'
        :pct>=60?'Ça vient. Refais ce niveau : c\'est la répétition du CONTRASTE qui installe le repère.'
        :'Reste ici, ne monte pas. Utilise « ① seul » / « ② seul » et chante la note du milieu avant de répondre.'}</div></div>`;
    setTimeout(()=>cb(true,score),1500);
  };
  next();
}

/* ---------- moteur : NOMMER L'ACCORD ---------- */
function runNamer(el,ex,cb){
  let i=0, score=0; const badIdx=new Set();
  el.innerHTML=`<div class="exhead"><div class="target">🕵️</div><div class="sub">${ex.sub||''}</div></div>
    <div class="exprog" id="dots"></div><div id="kb"></div>
    <button class="btn small ghost" id="replay" style="display:block;margin:0 auto">🔊 Réécouter</button>
    <div class="earbtns" id="btns"></div><div class="fb" id="fb"></div>`;
  const kb=buildKeyboard(48,72,m=>playNote(m,.8));
  el.querySelector('#kb').appendChild(kb);
  const dots=el.querySelector('#dots'), fb=el.querySelector('#fb'), btns=el.querySelector('#btns');
  let cur=null;
  const play=()=>{ if(cur) playChord(cur.v,1.5); };
  el.querySelector('#replay').onclick=play;
  const next=()=>{
    kb.clearSel();
    const root=Math.floor(Math.random()*12);
    const t=ex.types[Math.floor(Math.random()*ex.types.length)];
    cur={root,t,v:voicingFor(root,t)};
    cur.v.forEach(m=>{ const k=kb.keyEl(m); if(k) k.classList.add('hint'); });
    const good=chordName(root,t);
    const opts=new Set([good]);
    while(opts.size<4){
      const r2=Math.floor(Math.random()*12), t2=ex.types[Math.floor(Math.random()*ex.types.length)];
      opts.add(chordName(r2,t2));
    }
    btns.innerHTML='';
    [...opts].sort(()=>Math.random()-.5).forEach(o=>{
      const b=document.createElement('button'); b.className='btn ghost'; b.textContent=o;
      b.onclick=()=>{
        btns.querySelectorAll('.btn').forEach(x=>x.style.pointerEvents='none');
        if(o===good){ score++; b.classList.add('ok'); tada(); fb.textContent='✓ Oui : '+chordNotes(root,t); fb.className='fb ok'; }
        else { buzz(); badIdx.add(i); fb.textContent='✗ C\'était '+good+' : '+chordNotes(root,t); fb.className='fb bad';
          [...btns.querySelectorAll('.btn')].find(x=>x.textContent===good).classList.add('ok'); }
        setTimeout(()=>{ i++; if(i<ex.count) next(); else fin(); },1400);
      };
      btns.appendChild(b);
    });
    fb.textContent=''; fb.className='fb';
    progDots(dots,ex.count,i,badIdx);
    setTimeout(play,300);
  };
  const fin=()=>{
    el.innerHTML=`<div class="exhead"><div class="target">🕵️ ${score}/${ex.count}</div>
      <div class="sub">${score===ex.count?'Rien ne t\'échappe.':'Les ratés : reconstruis-les avec la formule, pas de par-cœur.'}</div></div>`;
    setTimeout(()=>cb(true,score),1200);
  };
  next();
}

/* logique pure du mode « À toi de jouer » : une frappe → une décision.
   st={pos,wrong,done} muté ; renvoie l'action à jouer côté UI. */
function practiceTap(st, seq, midi){
  if(st.done) return {a:'free'};
  const exp=seq[st.pos].midi;
  if(midi===exp){
    st.pos++;
    if(st.pos>=seq.length){ st.done=true; return {a:'finish'}; }
    return {a:'ok'};
  }
  st.wrong++;
  return {a:'bad', exp};
}

/* ---------------- moteur play-along ---------------- */
const Player = {
  song:null, hands:'both', rate:1, loop:false, click:false, playing:false,
  ctx:null, timer:null, raf:null, anchorTime:0, anchorBeat:0, ai:0, spb:0,
  ae:[], melTL:[], chTL:[], total:0, kb:null, els:{}, onEnd:null, awarded:false,
  build(){
    const s=this.song;
    this.melTL=[]; let t=0;
    s.mel.forEach(([m,d])=>{ if(m!=null) this.melTL.push({t0:t,t1:t+d,midi:m}); t+=d; });
    const melBeats=t;
    this.chTL=[]; t=0;
    s.ch.forEach(([root,type])=>{ this.chTL.push({t0:t,t1:t+s.ts,root,type,label:chordName(root,type),notes:chordNotes(root,type)}); t+=s.ts; });
    const chBeats=t;
    this.total=Math.max(melBeats,chBeats)||chBeats;
    /* événements audio */
    const ae=[];
    if(this.hands!=='accomp') this.melTL.forEach(e=>ae.push({t:e.t0, midi:e.midi, dur:e.t1-e.t0, vel:.42}));
    const groove=this.groove||'straight';
    if(this.hands!=='melody') this.chTL.forEach(c=>{
      /* basse : temps 1 (+ quinte au temps 3 en 4/4) */
      ae.push({t:c.t0, midi:36+c.root, dur:s.ts*.7, vel:.4});
      if(s.ts>=4) ae.push({t:c.t0+2, midi:36+((c.root+7)%12), dur:1.8, vel:.34});
      /* accord : « straight » = plaqué sur les temps forts ; « ballade » = comp syncopée,
         accords glissés sur les contretemps (le groove soul/reggae — la variante rythmique). */
      const compBeats = groove==='ballade'
        ? (s.ts>=4 ? [1.5,2.5,3.5] : (s.ts===3 ? [1,1.5,2,2.5] : [0.5]))
        : (s.ts>=4 ? [0,2] : (s.ts===3 ? [1,2] : [0]));
      const compDur = groove==='ballade' ? 0.55 : 1.3;
      const compVel = groove==='ballade' ? 0.17 : 0.15;
      voicingFor(c.root,c.type).forEach(m=> compBeats.forEach(bt=> ae.push({t:c.t0+bt, midi:m, dur:compDur, vel:compVel})));
    });
    if(this.click) for(let b=0;b<this.total;b++) ae.push({t:b, click:true, accent:b%s.ts===0});
    ae.sort((a,b)=>a.t-b.t);
    this.ae=ae;
  },
  start(){
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    this.playing=false; this._lastStrip=-1;
    this.build();
    const ctx=ac(); this.ctx=ctx;
    this.spb=60/(this.song.bpm*this.rate);
    /* décompte : une mesure de clics avant le morceau */
    const t0=ctx.currentTime+.14, ci=this.song.ts;
    for(let i=0;i<ci;i++) Metro.click(t0+i*this.spb, i===0);
    this.anchorTime=t0+ci*this.spb; this.anchorBeat=0; this.ai=0;
    this.playing=true; this.awarded=false;
    this.timer=setInterval(()=>this._sched(),25);
    this._frame();
    if(this.els.play) this.els.play.textContent='⏸ Stop';
  },
  _sched(){
    if(!this.playing) return;
    const ctx=this.ctx, look=.13, spb=this.spb;
    while(this.ai<this.ae.length){
      const ev=this.ae[this.ai], when=this.anchorTime+(ev.t-this.anchorBeat)*spb;
      if(when<ctx.currentTime+look){
        if(when>ctx.currentTime-.06){
          if(ev.click) Metro.click(when, ev.accent);
          else playNote(ev.midi, Math.max(.14,ev.dur*spb*.9), ev.vel, when-ctx.currentTime);
        }
        this.ai++;
      } else return;
    }
    const endT=this.anchorTime+(this.total-this.anchorBeat)*spb;
    if(ctx.currentTime>=endT-.02){
      if(this.loop){ this.anchorBeat=0; this.anchorTime=endT; this.ai=0; }
      else this.stop(true);
    }
  },
  _frame(){
    if(!this.playing) return;
    const beat=(this.ctx.currentTime-this.anchorTime)/this.spb+this.anchorBeat;
    const counting=beat<0;
    const bb=counting?0:(this.loop ? (beat%this.total) : Math.min(beat,this.total-.0001));
    if(this.kb){
      this.kb.clearSel();
      const chord=this.chTL.find(e=>bb>=e.t0&&bb<e.t1)||this.chTL[this.chTL.length-1];
      if(chord){
        [36+chord.root, ...voicingFor(chord.root,chord.type)].forEach(m=>{ const k=this.kb.keyEl(m); if(k) k.classList.add('hint'); });
        this._strip(this.chTL.indexOf(chord));
        if(this.els.cn){
          if(counting){ this.els.cn.textContent='· '+Math.max(1,Math.ceil(-beat))+' ·'; this.els.nn.textContent='Prêt…'; }
          else { this.els.cn.textContent=chord.label; this.els.nn.textContent=chord.notes; }
        }
      }
      if(!counting && this.hands!=='accomp'){
        const cur=this.melTL.find(e=>bb>=e.t0&&bb<e.t1);
        if(cur){ const k=this.kb.keyEl(cur.midi); if(k){ k.classList.remove('hint'); k.classList.add('sel'); } }
      }
    }
    if(this.els.bar) this.els.bar.style.width=Math.min(100,Math.max(0,beat)/this.total*100)+'%';
    this.raf=requestAnimationFrame(()=>this._frame());
  },
  _strip(idx){
    if(this._lastStrip===idx || !this.els.strip) return;
    this._lastStrip=idx;
    const chips=this.els.strip.children;
    for(let i=0;i<chips.length;i++) chips[i].classList.toggle('cur',i===idx);
    const cur=chips[idx]; if(cur) cur.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  },
  stop(natural){
    const wasPlaying=this.playing;
    this.playing=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
    if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; }
    if(this.kb) this.kb.clearSel();
    this._lastStrip=-1;
    if(this.els.play) this.els.play.textContent='▶ Jouer';
    if(!wasPlaying || !this.song) return;
    const played=(this.ctx.currentTime-this.anchorTime)/this.spb+this.anchorBeat;
    if(this.song.jam){
      if(played>=8 && !this.awarded){ this.awarded=true; award(8); dailyMark('song'); toast('🎶 Jam validé · +8 XP'); }
    } else if(natural){
      const id=this.song.id, first=!S.songs[id];
      S.songs[id]=(S.songs[id]||0)+1; save();
      award(first?15:5); chime(); dailyMark('song');
      toast(first?'🎉 Morceau joué en entier · +15 XP':'↻ Rejoué · +5 XP');
      if(this.els.bar) this.els.bar.style.width='100%';
    }
    if(this.onEnd) this.onEnd();
  }
};

function openSong(song){
  openCustom(song.title,(inner)=>{

    /* plage clavier calée sur les notes réellement jouées */
    let lo=127, hi=0;
    (song.mel||[]).forEach(([m])=>{ if(m!=null){ lo=Math.min(lo,m); hi=Math.max(hi,m); } });
    song.ch.forEach(([r,t])=>{ [36+r, ...voicingFor(r,t)].forEach(m=>{ lo=Math.min(lo,m); hi=Math.max(hi,m); }); });
    lo=Math.max(24, (Math.floor(lo/12)*12)); hi=Math.min(84, (Math.ceil((hi+1)/12)*12));

    const info=document.createElement('p');
    info.style.cssText='color:var(--dim);font-size:13px;margin:-4px 0 4px;text-align:center';

    song.ch.forEach(([r,t])=>{ const c=document.createElement('div'); c.className='cc'; c.textContent=chordName(r,t); strip.appendChild(c); });
    inner.appendChild(strip);

    /* séquence de mélodie pour le mode interactif (notes non-silence, dans l'ordre) */
    const iSeq=[]; { let t=0; (song.mel||[]).forEach(([m,d])=>{ if(m!=null) iSeq.push({midi:m, t0:t}); t+=d; }); }
    const chordAt = t0 => song.ch[Math.min(song.ch.length-1, Math.floor(t0/song.ts))];

    let mode='demo';   // 'demo' | 'play' | 'lh'
    const P={ pos:0, wrong:0, done:false };

    /* séquence main gauche : une étape par mesure — la basse d'abord, puis l'accord */
    const lhSeq=[]; if(!song.jam){ let t=0; song.ch.forEach(([r,ty])=>{ lhSeq.push({t0:t, root:r, type:ty, label:chordName(r,ty), bass:36+r, voi:voicingFor(r,ty)}); t+=song.ts; }); }
    const melOfMeasure=i=>{ const t0=lhSeq[i].t0, t1=t0+song.ts; const out=[]; let t=0; (song.mel||[]).forEach(([m,d])=>{ if(m!=null&&t>=t0&&t<t1) out.push({midi:m,off:t-t0,dur:d}); t+=d; }); return out; };
    const L={ idx:0, gotBass:false, need:[], wrong:0, done:false };

    const ibar=ipb.querySelector('i');
